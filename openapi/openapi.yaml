openapi: 3.1.3

info:
  title: BFF Web — Onboarding
  summary: API del canal web para registro y onboarding de clientes de Solventa.
  description: |
    Backend for Frontend del cliente web. Orquesta el *journey de originación*.

    Alcance de esta versión (`0.1.x`): **registro de cliente** (identidad + alta en
    CoreTransaccional), el paso de **consentimientos** y **cotización** (orquesta
    hacia Cotización y Rating; EXP-01, BITS-81). El paso de perfilamiento propio
    del BFF se agrega en versiones posteriores.

    Entrada real: `Cliente Web → Cloud LB → Cloud Armor (WAF) → API Gateway → BFF Web`.
    El API Gateway valida firma y expiración del token; el BFF valida identidad de
    negocio y scopes.

    Errores en formato **RFC 9457 (Problem Details)**, `application/problem+json`.
  version: 0.1.0
  contact:
    name: Equipo 4Bits
  license:
    name: Uso académico 4Bits

servers:
  - url: https://dev.solventa4bits.com/web
    description: Entorno de desarrollo

tags:
  - name: Registro
    description: Alta de una persona en la plataforma.
  - name: Sesión
    description: Inicio de sesión y refresco de token.
  - name: Cuenta
    description: Datos del cliente autenticado.
  - name: Consentimientos
    description: Consentimientos del cliente autenticado.
  - name: Cotización
    description: Cotización de seguro de vida sobre crédito hipotecario (orquesta hacia Cotización y Rating).
  - name: Documentos legales
    description: Textos legales versionados que el registro muestra antes de pedir la aceptación (los publica Productos y Configuración de Mercado).
  - name: Evidencias de identidad
    description: Cédula por ambas caras y selfie previas a la firma. Una foto por request; el servidor decide si sirve.

  - name: Pólizas
    description: Solicitud, consulta y documento de mis pólizas (BITS-101).
  - name: Siniestros
    description: Consulta de mis siniestros (BITS-383, BITS-384). El reporte y lo que falta se envían desde la app móvil.
  - name: Ingreso del personal
    description: Ingreso y refresco de la sesión del Backoffice para `ADMIN` y `SOCIO` (BITS-375).
  - name: Socio
    description: Venta directa del socio (BITS-378). Todas exigen una sesión del personal con rol `SOCIO`; el `socioId` de una venta es siempre el `uid` del token.
  - name: Backoffice
    description: Rutas del Backoffice. Todas exigen una sesión del personal con rol `ADMIN`, salvo el ingreso y el refresco (`/v1/backoffice/sesiones*`).
security:
  - clienteAuth: []

paths:
  /v1/registro:
    post:
      operationId: registrarse
      tags: [Registro]
      summary: Registra una persona y abre sesión
      description: |
        **Público** (no requiere token).

        Orquesta:
        1. Crea la credencial de autenticación en Identity Platform.
        2. Crea el cliente en CoreTransaccional (`POST /v1/clientes`) con el `identityRef`.
        3. Devuelve una sesión iniciada.

        Si el correo o el documento ya existen responde `409` y no deja nada creado
        (revierte la credencial si alcanzó a crearse). El campo repetido viaja en
        `errores[].campo` (`correo` o `documento`), sin revelar datos de otra persona.

        **Reintentos (`Idempotency-Key`).** Si el cliente reintenta con la misma clave
        porque perdió la respuesta, y envía el mismo correo y contraseña, recibe `201`
        con la cuenta ya creada y una sesión nueva, sin duplicar nada. Con otra
        contraseña, o sin clave, un correo ya registrado es un `409` normal.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroRequest' }
      responses:
        '201':
          description: Cliente creado y sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroResponse' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/EntidadNoProcesable' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/registro/disponibilidad:
    get:
      operationId: consultarDisponibilidad
      tags: [Registro]
      summary: Consulta si un correo y/o documento ya están registrados
      description: |
        **Público** (no requiere token). Chequeo de solo lectura para validar en
        vivo el formulario de registro (BITS-93) — proxya a CoreTransaccional.
        No reemplaza la validación atómica de `POST /v1/registro`.

        Pendiente (BITS-251, sin resolver): decisión de arquitectura sobre
        reconocimiento de cliente (App Check) para distinguir apps reales de
        tráfico de ataque en este endpoint público sin usuario autenticado.
      security: []
      parameters:
        - name: correo
          in: query
          required: false
          schema: { type: string, format: email, maxLength: 254 }
        - name: tipoDocumento
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TipoDocumento' }
        - name: numeroDocumento
          in: query
          required: false
          schema: { type: string, minLength: 4, maxLength: 20 }
      responses:
        '200':
          description: Disponibilidad de los campos consultados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disponibilidad' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }

  /v1/registro/reenvio-confirmacion:
    post:
      operationId: reenviarConfirmacion
      tags: [Registro]
      summary: Reenvía el correo de activación
      description: |
        Requiere el **ID token de Identity Platform** de la sesión recién creada
        y aún no confirmada (no la sesión propia del BFF) — así no hace falta un
        endpoint público indexado por correo. Identity Platform reenvía el
        enlace con su propio mecanismo (BITS-93 AC-4); esta operación no impone
        una ventana de vencimiento propia.
      security:
        - identityPlatformToken: []
      responses:
        '204':
          description: Correo de activación reenviado.
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/registro/confirmacion:
    post:
      operationId: confirmarCuenta
      tags: [Registro]
      summary: Confirma el correo con el código del enlace de verificación
      description: |
        **Público** (no requiere token ni sesión): el usuario puede abrir el enlace
        en otro dispositivo. El correo de verificación lleva un enlace a la web,
        `https://solventa4bits.com/verificar-correo?oobCode=XXXX`; la página lee el
        `oobCode` y lo envía aquí con un `POST` (nunca un `GET` directo, porque los
        escáneres de correo abren los enlaces y consumirían el código).

        El BFF canjea el código con Identity Platform (queda el correo verificado
        allí) y confirma la cuenta en CoreTransaccional con su fecha (BITS-93 AC-5).

        El código es **de un solo uso** y vence según Identity Platform: un código
        ya usado, vencido o inválido responde `422` con un mismo mensaje. El código
        no se registra en logs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmacionRequest' }
      responses:
        '200':
          description: Correo confirmado (`correoConfirmado` en `true`).
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuenta' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '422': { $ref: '#/components/responses/EntidadNoProcesable' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/sesiones:
    post:
      operationId: iniciarSesion
      tags: [Sesión]
      summary: Inicia sesión con correo y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredencialesRequest' }
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/sesiones/refresco:
    post:
      operationId: refrescarSesion
      tags: [Sesión]
      summary: Refresca el token de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Nuevo token de acceso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/backoffice/sesiones:
    post:
      operationId: iniciarSesionPersonal
      tags: [Ingreso del personal]
      summary: Inicia la sesión del Backoffice con correo y contraseña
      description: |
        **Público.** Solo para el personal de Solventa: correo `@solventa4bits.com` y una cuenta
        con rol `ADMIN` o `SOCIO`. Nadie elige el rol al ingresar: lo trae la cuenta.

        El token es de otro tipo (`typ: consola`) que el del cliente: no sirve en `/v1/cuenta/*`
        ni en `/v1/cotizaciones/*` (401), y el de un cliente no sirve en `/v1/backoffice/*` ni en
        `/v1/socio/*` (401). El acceso dura 15 minutos y el refresco 8 horas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredencialesRequest' }
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionConsola' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: |
            `ACCESO_POR_PORTAL_CLIENTE` (el correo no es `@solventa4bits.com`: los clientes entran
            por solventa4bits.com, y no se consulta a Identity Platform) o `CUENTA_SIN_ROL` (la
            cuenta existe pero no tiene rol `ADMIN` ni `SOCIO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }

  /v1/backoffice/sesiones/refresco:
    post:
      operationId: refrescarSesionPersonal
      tags: [Ingreso del personal]
      summary: Renueva la sesión del Backoffice
      description: |
        **Público.** Conserva el rol del token de refresco: un cambio de rol se nota al volver
        a iniciar sesión.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Nueva sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionConsola' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/backoffice/siniestros:
    get:
      operationId: listarBandejaDeSiniestros
      tags: [Backoffice]
      summary: Bandeja de siniestros de todos los clientes
      description: |
        Solo `ADMIN`. Sin filtros trae todos. `estado=EN_ESTUDIO` es la bandeja de trabajo (los
        recién reportados y los que volvieron porque el cliente envió lo que faltaba);
        `automatico=true`, los pagos por sismo, en solo lectura. Va ordenada por plazo: primero los
        que corren (`EN_ESTUDIO`), del que vence antes al que vence después, y luego los demás, del
        más reciente al más antiguo. No hay aviso aparte al `ADMIN`: la bandeja es su aviso.
      security:
        - consolaAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EstadoSiniestro' }
        - name: automatico
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Los siniestros que cumplen los filtros (vacía si no hay).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SiniestroInternoResumen' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `ADMIN` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/backoffice/siniestros/{siniestroId}:
    parameters:
      - name: siniestroId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: obtenerSiniestroDeLaBandeja
      tags: [Backoffice]
      summary: Detalle de un siniestro para el ADMIN
      description: |
        Solo `ADMIN`. El detalle del cliente más lo que solo el `ADMIN` ve: el cliente, la póliza con
        la cobertura afectada y su suma asegurada, el saldo del crédito guardado al reportar con su
        origen y su fecha, cómo recibe el pago el cliente y las decisiones con quién las tomó. Si pidió
        más evidencia, `evidenciaPedida` y los archivos que el cliente envió después, con la fecha de
        cada entrega.
      security:
        - consolaAuth: []
      responses:
        '200':
          description: El siniestro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiniestroInterno' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `ADMIN` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/backoffice/siniestros/{siniestroId}/evidencias/{evidenciaId}:
    parameters:
      - name: siniestroId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: evidenciaId
        in: path
        required: true
        description: El `id` de un archivo del siniestro (`archivos[].id` del detalle).
        schema: { type: string, format: uuid }
    get:
      operationId: obtenerArchivoDeLaBandeja
      tags: [Backoffice]
      summary: Devuelve un archivo del siniestro
      description: |
        Solo `ADMIN`. La imagen tal como se guardó, para abrirla en la bandeja en tamaño suficiente
        sin descargarla (`Content-Disposition: inline`). Sin caché.
      security:
        - consolaAuth: []
      responses:
        '200':
          description: El archivo.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `ADMIN` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/backoffice/siniestros/{siniestroId}/decisiones:
    parameters:
      - name: siniestroId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: decidirSiniestro
      tags: [Backoffice]
      summary: Paga, pide más evidencia o rechaza un siniestro
      description: |
        Solo `ADMIN`. **El `agente` de la decisión es el correo de la sesión**: el cuerpo no lo lleva
        y un campo de más (incluido `agente`) es `400`. Cada decisión guarda quién la tomó, cuándo,
        cuál fue y el valor o el motivo. No hay nota interna. Una decisión con un campo que no le
        corresponde es `400`.

        | Decisión | Campos | Resultado |
        |---|---|---|
        | `PAGAR`, incapacidad total | ninguno más | Una línea `BANCO` por el saldo guardado |
        | `PAGAR`, Tu casa reparable | `dano: REPARABLE`, `valor` | Una línea `CLIENTE` al destino que eligió |
        | `PAGAR`, Tu casa pérdida total | `dano: PERDIDA_TOTAL`, `valor` | `BANCO` hasta el saldo guardado y `CLIENTE` por el resto; si el valor no supera el saldo, solo `BANCO` |
        | `PEDIR_EVIDENCIA` | `detalle` | `FALTA_INFORMACION`, con `evidenciaPedida` |
        | `RECHAZAR` | `motivo` | `RECHAZADO`, con el motivo que ve el cliente |

        El `valor` de Tu casa no puede superar la suma asegurada de `HOGAR` (`422`). Pagar, pedir o
        rechazar avisa por push al cliente.

        **Una sola orden de pago por siniestro.** Pagar un siniestro ya `PAGADO`, al mismo tiempo o
        después, no crea otra orden y devuelve la que existe. Un siniestro ya `PAGADO` o `RECHAZADO` no
        cambia con ninguna decisión: se devuelve como quedó. Uno en `FALTA_INFORMACION` ya salió de la
        bandeja y responde `409`.
      security:
        - consolaAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecidirSiniestroRequest' }
      responses:
        '200':
          description: El siniestro después de la decisión (o como ya estaba).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiniestroInterno' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `ADMIN` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El siniestro está en `FALTA_INFORMACION` (`codigo = ESTADO_NO_PERMITE`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaSiniestro' }
        '422':
          description: El `valor` supera la suma asegurada (`codigo = VALOR_SUPERA_SUMA_ASEGURADA`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaSiniestro' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/backoffice/solicitudes:
    get:
      operationId: listarBandejaDeSolicitudes
      tags: [Backoffice]
      summary: Solicitudes de póliza que esperan una revisión
      description: |
        Solo `ADMIN`. Las solicitudes `PENDIENTE` que tienen un pendiente de agente (identidad o
        crédito), de la más antigua a la más reciente. Una solicitud sale de la bandeja cuando se
        aprueba, se rechaza o vence. Pagina con `limite` y `cursor`: el `siguienteCursor` de una
        página es el `cursor` de la siguiente.
      security:
        - consolaAuth: []
      parameters:
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Una página de la bandeja (vacía si no hay nada por revisar).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaSolicitudes' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `ADMIN` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/backoffice/solicitudes/{polizaId}:
    parameters:
      - name: polizaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: obtenerSolicitudEnRevision
      tags: [Backoffice]
      summary: El detalle de una solicitud
      description: |
        Solo `ADMIN`. La solicitud tal como la ve el cliente (crédito con su origen, coberturas con
        la prima, pendientes) más lo que hace falta para revisarla: el cliente (nombre y documento
        completo, nunca correo ni teléfono), las evidencias de identidad con su `evidenciaId` y las
        decisiones anteriores. Si no se alcanza al cliente responde `503`: no se devuelve a medias.
      security:
        - consolaAuth: []
      responses:
        '200':
          description: La solicitud.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudDetalle' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `ADMIN` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/backoffice/solicitudes/{polizaId}/evidencias/{evidenciaId}:
    parameters:
      - name: polizaId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: evidenciaId
        in: path
        required: true
        description: El `evidenciaId` de una de las `evidencias` de esa solicitud.
        schema: { type: string, format: uuid }
    get:
      operationId: obtenerImagenDeLaSolicitud
      tags: [Backoffice]
      summary: Devuelve la foto de una evidencia de identidad
      description: |
        Solo `ADMIN`. La imagen tal como se guardó (cédula por un lado, selfie), para abrirla en la
        revisión sin descargarla (`Content-Disposition: inline`). Sin caché. Una evidencia que no es
        de esa solicitud responde `404`, aunque exista.
      security:
        - consolaAuth: []
      responses:
        '200':
          description: La imagen.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `ADMIN` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/backoffice/solicitudes/{polizaId}/decisiones:
    parameters:
      - name: polizaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: decidirSolicitud
      tags: [Backoffice]
      summary: Aprueba pendientes o rechaza una solicitud
      description: |
        Solo `ADMIN`. **El agente de la decisión es el correo de la sesión**: el cuerpo no lo lleva
        y un campo de más (incluidos `agente` y `nota`) es `400`.

        | Decisión | Campos | Resultado |
        |---|---|---|
        | `APROBAR` | `pendientes`: los que se verificaron | Quedan resueltos. Si no queda ninguno, la póliza se emite en la misma operación |
        | `RECHAZAR` | `motivo`: un solo pendiente de la solicitud | `RECHAZADA`; el cliente ve el texto de ese motivo |

        Repetir una aprobación ya registrada no es un error. Una solicitud vencida o que ya decidió
        otra persona responde `409`; un pendiente que la solicitud no tiene, `422`. La decisión
        guarda quién, cuándo y qué pendientes.
      security:
        - consolaAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecidirSolicitudRequest' }
      responses:
        '200':
          description: La solicitud después de la decisión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Solicitud' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `ADMIN` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >-
            La solicitud venció (`codigo = SOLICITUD_VENCIDA`) o ya no está pendiente
            (`codigo = POLIZA_NO_PENDIENTE`): el Backoffice refresca la bandeja.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaPoliza' }
        '422':
          description: La solicitud no tiene ese pendiente (`codigo = PENDIENTE_NO_APLICA`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaPoliza' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/backoffice/usuarios:
    post:
      operationId: crearUsuarioInterno
      tags: [Backoffice]
      summary: Crea una cuenta del personal (administrador o socio)
      description: |
        Solo `ADMIN`. Crea la cuenta en Identity Platform a través de svc-core, con el correo ya
        verificado. El correo debe ser `@solventa4bits.com`. `nombre` es obligatorio para `SOCIO`
        (es el que ve el cliente) y puede repetirse entre cuentas. El `uid` de un `SOCIO` es su
        `socioId`.
      security:
        - consolaAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearUsuarioRequest' }
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `ADMIN` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/socio/entidades-financieras:
    get:
      operationId: listarEntidadesDelSocio
      tags: [Socio]
      summary: Bancos del mercado, para elegir el que aprobó el crédito
      description: |
        Solo `SOCIO`. La misma lista que ve el cliente al cotizar, sin las hipotecas de nadie.
      security:
        - consolaAuth: []
      parameters:
        - name: mercado
          in: query
          required: false
          schema: { type: string, enum: [CO], default: CO }
      responses:
        '200':
          description: Entidades del mercado.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntidadFinanciera' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `SOCIO` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/socio/clientes:
    get:
      operationId: buscarClienteDelSocio
      tags: [Socio]
      summary: Busca al cliente al que se le va a vender
      description: |
        Solo `SOCIO`. Por `correo`, por `tipoDocumento` y `numeroDocumento` (siempre juntos) o por
        los dos a la vez; `400` si no llega ninguno. Con correo y documento a la vez deben ser de
        la misma cuenta: si son de cuentas distintas, o el correo es de una cuenta y el documento
        no es de nadie, responde `409 CLIENTES_DISTINTOS` y `errores[0].campo` dice cuál choca.

        Devuelve lo mínimo para elegirlo: nombre, tipo de documento y **los últimos cuatro
        dígitos** del documento. No devuelve correo, teléfono, fecha de nacimiento ni el documento
        completo. `404` si no existe: se le da de alta con `POST /v1/socio/clientes`.
      security:
        - consolaAuth: []
      parameters:
        - name: correo
          in: query
          required: false
          schema: { type: string, maxLength: 254 }
        - name: tipoDocumento
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TipoDocumento' }
        - name: numeroDocumento
          in: query
          required: false
          schema: { type: string, minLength: 4, maxLength: 20 }
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteSocio' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `SOCIO` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El correo y el documento son de cuentas distintas (`codigo = CLIENTES_DISTINTOS`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
    post:
      operationId: crearClienteDelSocio
      tags: [Socio]
      summary: Da de alta al cliente al que se le va a vender
      description: |
        Solo `SOCIO`. Crea la cuenta del cliente con el correo ya verificado y una contraseña
        temporal que el sistema genera y manda **al correo del cliente** (el socio no la ve), y lo
        registra sin ninguna autorización de datos: el cliente las otorga después, él mismo.

        `409` si el correo o el documento ya existen (`errores[0].campo` dice cuál): se busca al
        cliente con `GET /v1/socio/clientes`. Con `Idempotency-Key`, un reintento devuelve el
        mismo cliente sin crear otra cuenta ni mandar otro correo.
      security:
        - consolaAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearClienteSocioRequest' }
      responses:
        '201':
          description: Cliente creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteSocio' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `SOCIO` (`codigo = ROL_NO_PERMITIDO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaConsola' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/socio/ventas/precio:
    post:
      operationId: calcularPrecioDeVenta
      tags: [Socio]
      summary: Precio del seguro para el crédito de un cliente
      description: |
        Solo `SOCIO`. **No guarda nada**: no crea cotización ni solicitud, y no toca las que el
        cliente tenga por su cuenta. El crédito es nuevo, así que el saldo es el valor. La edad sale
        de la fecha de nacimiento del cliente. Trae Vida (obligatoria) y Hogar (opcional) con su
        precio mensual.

        `422 FUERA_DE_RANGO` si el cliente no tiene entre 18 y 65 años o el crédito termina después
        de los 75. `403 CLIENTE_NO_ACTIVO` si el cliente no está activo.
      security:
        - consolaAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrecioVentaRequest' }
      responses:
        '200':
          description: El precio calculado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrecioVenta' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `SOCIO` (`ROL_NO_PERMITIDO`) o el cliente no está activo (`CLIENTE_NO_ACTIVO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaPoliza' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/FueraDeRango' }
        '503': { $ref: '#/components/responses/NoDisponible' }

  /v1/socio/ventas:
    post:
      operationId: venderPoliza
      tags: [Socio]
      summary: Vende y emite la póliza a nombre del cliente
      description: |
        Solo `SOCIO`. Emite **al instante**, sin solicitud ni pendientes: el socio verificó al
        cliente cara a cara y el banco ya aprobó el crédito. El precio se calcula de nuevo con la
        tarifa del momento. Las condiciones de la póliza se aceptan en su versión vigente. El
        `socioId` es siempre el del token: no se puede vender a nombre de otro socio.

        **`Idempotency-Key` es obligatorio** (`400` sin él): un reintento con la misma clave
        devuelve la misma póliza y no emite otra. El cliente recibe el aviso de la venta y, cuando
        el documento está listo, la póliza por correo.
      security:
        - consolaAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Una clave por intento de venta; se reutiliza solo al reintentar ese intento.
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VentaRequest' }
      responses:
        '201':
          description: Póliza emitida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venta' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403':
          description: La sesión no es de un `SOCIO` (`ROL_NO_PERMITIDO`) o el cliente no está activo (`CLIENTE_NO_ACTIVO`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaPoliza' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoPoliza' }
        '422': { $ref: '#/components/responses/FueraDeRango' }
        '503': { $ref: '#/components/responses/NoDisponible' }

  /v1/cuenta/siniestros:
    get:
      operationId: listarMisSiniestros
      tags: [Siniestros]
      summary: Lista mis siniestros
      description: |
        Del más reciente al más antiguo, sin paginar. Incluye los de pago automático por sismo
        (`automatico: true`). El detalle de cada uno está en `/v1/cuenta/siniestros/{siniestroId}`.
        El `clienteId` sale de la sesión. El portal solo consulta: el reporte y el envío de lo que
        falta se hacen desde la app móvil.
      responses:
        '200':
          description: Mis siniestros (vacía si no tengo).
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SiniestroResumen' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cuenta/siniestros/{siniestroId}:
    parameters:
      - name: siniestroId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: obtenerMiSiniestro
      tags: [Siniestros]
      summary: En qué va mi siniestro
      description: |
        Estado, plazo y lo que necesito saber: lo que Solventa pidió (`evidenciaPedida`), el motivo
        del rechazo, la orden de pago y mis archivos con la fecha de cada entrega. En el paramétrico
        trae también `automatico` y `evento`.

        `fechaLimite` (la última entrega más un mes) solo existe en `EN_ESTUDIO`: en
        `FALTA_INFORMACION` el reloj se detiene. **No devuelve el saldo del crédito ni el destino
        del pago.** Un siniestro de otro cliente responde `404`, igual que uno que no existe.
      responses:
        '200':
          description: El siniestro.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Siniestro' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cuenta:
    get:
      operationId: obtenerCuenta
      tags: [Cuenta]
      summary: Devuelve los datos del cliente autenticado
      responses:
        '200':
          description: Datos del cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuenta' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/cuenta/consentimientos:
    get:
      operationId: listarMisConsentimientos
      tags: [Consentimientos]
      summary: Estado de mis consentimientos
      responses:
        '200':
          description: Lista de consentimientos del cliente.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConsentimientoVista' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
    post:
      operationId: otorgarMiConsentimiento
      tags: [Consentimientos]
      summary: Otorga un consentimiento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtorgarConsentimientoRequest' }
      responses:
        '201':
          description: Consentimiento otorgado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentimientoVista' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/cuenta/consentimientos/{scope}:
    parameters:
      - name: scope
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConsentimientoScope' }
    delete:
      operationId: revocarMiConsentimiento
      tags: [Consentimientos]
      summary: Revoca un consentimiento
      responses:
        '204':
          description: Consentimiento revocado.
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/documentos-legales:
    get:
      operationId: listarDocumentosLegales
      tags: [Documentos legales]
      summary: Documentos legales vigentes, con su contenido
      description: |
        **Público** (no requiere token): el registro los muestra antes de que exista
        una sesión.

        Devuelve la versión vigente de cada documento (`terminos`, `open-data`,
        `open-finance`) ya con el contenido completo, en el orden en que el registro
        los presenta. Una sola llamada deja listos los tres modales sin más viajes a
        la red. Proxya a Productos y Configuración de Mercado sin transformar nada.

        Sin `tipo` devuelve solo los tres del registro. Con `tipo=poliza` devuelve las
        condiciones de la póliza, que la interfaz muestra al solicitarla y cuya `version`
        envía en `documentosAceptados` de `POST /v1/cuenta/polizas`.

        **Aceptación.** El BFF no registra qué aceptó el cliente. La web devuelve la
        `version` de cada documento que mostró en los campos `politicaVersion*` de
        `POST /v1/registro`, y CoreTransaccional la guarda como evidencia.
      security: []
      parameters:
        - $ref: '#/components/parameters/Mercado'
        - $ref: '#/components/parameters/Idioma'
        - name: tipo
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TipoDocumentoLegal' }
      responses:
        '200':
          description: Versión vigente de cada documento del mercado e idioma.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentoLegal' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/documentos-legales/{tipo}/versiones/{version}:
    get:
      operationId: obtenerVersionDocumentoLegal
      tags: [Documentos legales]
      summary: Una versión exacta de un documento (inmutable)
      description: |
        **Público** (no requiere token). Devuelve el texto exacto de una versión ya
        publicada: sirve para mostrar lo que el cliente aceptó aunque exista una
        versión posterior.

        Una versión publicada nunca cambia, por eso la respuesta se puede guardar
        indefinidamente (`Cache-Control: immutable`).
      security: []
      parameters:
        - name: tipo
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TipoDocumentoLegal' }
        - name: version
          in: path
          required: true
          schema: { type: string, pattern: '^V[1-9][0-9]*$', examples: [V1] }
        - $ref: '#/components/parameters/Mercado'
        - $ref: '#/components/parameters/Idioma'
      responses:
        '200':
          description: Versión solicitada.
          headers:
            Cache-Control:
              description: Una versión publicada nunca cambia.
              schema: { type: string, example: 'public, max-age=31536000, immutable' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoLegal' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/creditos-hipotecarios:
    get:
      operationId: obtenerCreditosHipotecarios
      tags: [Cotización]
      summary: Hipotecas del cliente y bancos del mercado, para empezar una cotización
      description: |
        Paso previo a cotizar. Devuelve las hipotecas abiertas del cliente que
        Perfilamiento ya trajo de Open Finance cuando el cliente dio su consentimiento
        (no se consulta a la fuente en esta llamada), junto con la lista de bancos del
        mercado. El cliente elige un banco y rellena el formulario con los datos de esa
        hipoteca sin volver a llamar al backend; si no hay datos, escribe los suyos.

        `estado` dice qué mostrar:
        - `DISPONIBLE`: hay hipotecas en `creditos`; el cliente elige una.
        - `SIN_HIPOTECAS`: la fuente respondió y no hay ninguna abierta; captura manual.
        - `SIN_CONSENTIMIENTO`: el cliente no autorizó Open Finance; captura manual.
        - `NO_DISPONIBLE`: no hay datos vigentes y la fuente no respondió; el cliente
          puede reintentar o escribir los datos.

        Siempre incluye `entidades` (los bancos del mercado) para la captura manual.
        Los datos son del cliente autenticado y la respuesta no se guarda en caché.
      parameters:
        - name: mercado
          in: query
          required: false
          schema: { type: string, enum: [CO], default: CO }
      responses:
        '200':
          description: Hipotecas del cliente y bancos del mercado.
          headers:
            Cache-Control:
              schema: { type: string, examples: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditosHipotecarios' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cuenta/evidencias-identidad:
    post:
      operationId: subirMiEvidenciaIdentidad
      tags: [Evidencias de identidad]
      summary: Sube una foto de mi cédula (o la selfie) y recibe el veredicto
      description: |
        Una imagen por request, ya comprimida por el cliente: `tipo` dice qué se sube y
        `imagen` es el archivo (JPEG o PNG, máximo 3 MB). El `clienteId` sale del token.

        El servidor decide si la foto sirve; el cliente solo muestra el resultado:

        - **`ACEPTADA`** (201): la foto queda como evidencia vigente del tipo.
        - **`REINTENTAR`** (200): no se guardó nada. `motivo` dice qué corregir y
          `intentosRestantes` cuántos rechazos quedan antes de pasar a revisión manual.
        - **`REVISION_MANUAL`** (201): se guardó y una persona la revisa; el flujo puede seguir.
          Ocurre si no se pudo leer el código del reverso o su número no coincide con el del
          registro, si el documento no es cédula de ciudadanía, si el análisis tardó demasiado,
          y al tercer rechazo de un mismo tipo.

        El resultado nunca incluye el número leído de la imagen.

        **Selfie (`tipo = selfie`).** Se compara con el frente de la cédula ya guardado, así que
        primero deben estar vigentes **ambas caras** de la cédula; si no, responde `422` y no
        cuenta como intento. El servidor revisa que haya un solo rostro, que sea una persona real
        (prueba de vida pasiva) y que coincida con el de la cédula. Si no está seguro, la deja en
        `REVISION_MANUAL`. Los puntajes no salen en la respuesta.

        Cada envío cuenta como un intento: no se reintenta automáticamente ante un fallo de red.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SubirEvidenciaRequest' }
      responses:
        '200':
          description: La foto no sirve (`estado = REINTENTAR`). No se creó ninguna evidencia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaSubida' }
        '201':
          description: Evidencia guardada (`ACEPTADA` o `REVISION_MANUAL`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaSubida' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '413':
          description: La imagen supera el máximo permitido.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422':
          description: Se subió la selfie sin que ambas caras de la cédula estén vigentes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
    get:
      operationId: obtenerMiEstadoDeEvidenciasIdentidad
      tags: [Evidencias de identidad]
      summary: Estado de mis fotos de identidad
      description: |
        Siempre devuelve los tres tipos. `PENDIENTE` es que no hay evidencia vigente. Sirve para
        retomar el flujo donde quedó y para habilitar el paso a la firma: ambas caras de la
        cédula en `ACEPTADA` o `REVISION_MANUAL`.
      responses:
        '200':
          description: Estado por tipo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstadoEvidencia' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cotizaciones:
    post:
      operationId: crearCotizacion
      tags: [Cotización]
      summary: Cotiza un seguro de vida sobre crédito hipotecario
      description: |
        Calcula la cotización y la deja como **la activa** del cliente: una nueva reemplaza a
        la anterior (el cliente no acumula cotizaciones, compra pólizas). La cotización no
        tiene id propio.

        La identidad sale de la sesión: el cliente no puede cotizar en nombre de otro. La edad
        tampoco viaja en la solicitud: el BFF la calcula de la fecha de nacimiento de la sesión.
        Una sesión emitida antes de ese cambio responde `401`: hay que iniciar sesión de nuevo.

        Cotización y Rating intenta perfilar el riesgo; si esa dependencia no responde, cae a
        tarifa estándar (`personalizado: false`) en vez de fallar. Responde `400` con el campo
        y el rango cuando la edad no está entre 18 y 65 años, o cuando el crédito terminaría
        después de los 75 años.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CotizacionRequest' }
      responses:
        '201':
          description: Cotización creada. Es ahora la activa del cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '422': { $ref: '#/components/responses/EntidadNoProcesable' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cotizaciones/actual:
    get:
      operationId: obtenerCotizacionActiva
      tags: [Cotización]
      summary: Consulta la cotización activa del cliente
      description: |
        La cotización activa del cliente de la sesión, para mostrarla en el Home y retomarla.
        `estado` es `EXPIRADA` pasados 30 días de su creación.
      responses:
        '200':
          description: Cotización activa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      operationId: eliminarCotizacionActiva
      tags: [Cotización]
      summary: Elimina la cotización activa del cliente (declinar las condiciones)
      description: |
        El cliente declinó las condiciones: se borra su cotización activa y vuelve al estado
        de cero cotizaciones (`GET /v1/cotizaciones/actual` responde `404`). No se conserva
        historial. Si el cliente no tiene cotización activa responde `404`.

        La identidad sale de la sesión: el cliente solo puede eliminar su propia cotización.
      responses:
        '204':
          description: Cotización eliminada.
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cuenta/polizas:
    post:
      operationId: solicitarMiPoliza
      tags:
      - Pólizas
      summary: Solicita la póliza de mi cotización activa
      description: "El cliente envía **qué coberturas quiere**, **qué cotización vio** y **qué documentos\n\
        aceptó**. Prima, crédito y edad no se envían: salen de la cotización activa guardada.\n\nLa solicitud\
        \ se identifica por (cliente, `cotizacionCreadaEn`):\n\n- Si no existía, se crea (**201**). Queda\
        \ `EMITIDA` si no falta nada, o `PENDIENTE` con la\n  lista de `pendientes`. La interfaz decide\
        \ por `estado`, no por el código.\n- Si ya existía con las mismas coberturas, no se modifica nada:\
        \ si está `PENDIENTE` se\n  re-evalúa y se devuelve el estado actual (**200**); si está `EMITIDA`,\
        \ se devuelve tal\n  cual (**200**).\n- Si ya existía con coberturas distintas, **409** `SOLICITUD_EXISTENTE`.\
        \ Para cambiar de\n  coberturas el cliente vuelve a cotizar.\n- Si ya existía y fue `RECHAZADA`,\
        \ **409** `SOLICITUD_RECHAZADA`. Para intentarlo de nuevo\n  el cliente vuelve a cotizar.\n- Si\
        \ el cliente tenía otra solicitud `PENDIENTE` de otra cotización, esa se borra.\n\nLa póliza solo\
        \ consume las evidencias de identidad cuando se emite.\n\nErrores duros (no se crea nada): `400`\
        \ coberturas inválidas (cobertura desconocida o sin\n`VIDA`) o documentos sin aceptar; `403` cliente\
        \ no activo; `409` sin cotización, cotización\nvencida o distinta de la que vio el cliente; `422`\
        \ edad o plazo fuera de rango;\n`503` Cotización no disponible (reintentar).\n\nNo se reintenta\
        \ automáticamente ante un fallo de red.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarPolizaRequest'
            examples:
              soloVida:
                summary: Solo la cobertura obligatoria
                value:
                  coberturas:
                  - VIDA
                  cotizacionCreadaEn: '2026-10-24T15:04:05Z'
                  documentosAceptados:
                  - tipo: poliza
                    version: V1
              vidaYHogar:
                summary: Con Hogar
                value:
                  coberturas:
                  - VIDA
                  - HOGAR
                  cotizacionCreadaEn: '2026-10-24T15:04:05Z'
                  documentosAceptados:
                  - tipo: poliza
                    version: V1
      responses:
        '200':
          description: Ya existía una solicitud de esa cotización; se devuelve su estado actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
        '201':
          description: Solicitud creada (`EMITIDA` o `PENDIENTE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
              examples:
                pendiente:
                  summary: Quedó pendiente
                  value:
                    polizaId: 7c0f2a52-3b6f-4a0e-9e7e-2f6c9d1a8b11
                    numero: null
                    estado: PENDIENTE
                    producto: VIDA_HIPOTECARIO
                    creadaEn: '2026-10-24T15:10:00Z'
                    emitidaEn: null
                    solicitudVigenteHasta: '2026-11-23T15:04:05Z'
                    vigencia: null
                    coberturas:
                    - codigo: VIDA
                      obligatoria: true
                      sumaAsegurada: 180000000
                      primaNeta: 62000
                      iva: 11780
                      primaTotal: 73780
                    primaTotalMensual: 73780
                    moneda: COP
                    datosCredito:
                      valorCredito: 220000000
                      plazoRestanteMeses: 180
                      entidadAcreedora: Bancolombia
                      saldoInsoluto: 180000000
                    origenDatos: DECLARADO
                    cotizacionCreadaEn: '2026-10-24T15:04:05Z'
                    pendientes:
                    - codigo: EVIDENCIA_FALTANTE
                      tipo: USUARIO
                      mensaje: Sube la selfie para continuar.
                      detalle:
                        evidencias:
                        - selfie
                    - codigo: CREDITO_NO_VERIFICADO
                      tipo: AGENTE
                      mensaje: Los datos de tu crédito deben ser verificados por un agente.
                    documento:
                      estado: NO_DISPONIBLE
                    rechazo: null
                    documentosAceptados:
                    - tipo: poliza
                      version: V1
                      aceptadoEn: '2026-10-24T15:10:00Z'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/ConflictoPoliza'
        '422':
          $ref: '#/components/responses/FueraDeRango'
        '503':
          $ref: '#/components/responses/NoDisponible'
      security:
      - clienteAuth: []
    get:
      operationId: listarMisPolizas
      tags:
      - Pólizas
      summary: Lista mis pólizas
      description: 'Las pólizas del cliente, de la más reciente a la más antigua. Alimenta el Home. Sin

        paginar: un cliente tiene pocas. `estado` filtra; `VENCIDA` es el derivado.

        '
      parameters:
      - $ref: '#/components/parameters/EstadoPolizaFiltro'
      responses:
        '200':
          description: Pólizas del cliente.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Poliza'
        '401':
          $ref: '#/components/responses/NoAutenticado'
      security:
      - clienteAuth: []
  /v1/cuenta/polizas/{polizaId}:
    parameters:
    - $ref: '#/components/parameters/PolizaId'
    get:
      operationId: obtenerMiPoliza
      tags:
      - Pólizas
      summary: Consulta una póliza mía
      description: 'Si está `PENDIENTE`, **se re-evalúa antes de responder** (comprobaciones locales): si
        el

        cliente ya cumplió lo último que faltaba, la respuesta ya llega `EMITIDA`. La interfaz puede

        sondear este endpoint mientras muestra los pendientes.

        '
      responses:
        '200':
          description: La póliza con su estado y pendientes actuales.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - clienteAuth: []
  /v1/cuenta/polizas/{polizaId}/documento:
    parameters:
    - $ref: '#/components/parameters/PolizaId'
    get:
      operationId: obtenerDocumentoMiPoliza
      tags:
      - Pólizas
      summary: Descarga el documento de mi póliza
      description: 'Solo existe para pólizas `EMITIDA`. El documento lo genera de forma asíncrona la función
        de

        Comunicaciones y Documentos al recibir el evento de emisión; si todavía no está, se genera

        bajo demanda.

        '
      responses:
        '200':
          description: Documento listo; el enlace es temporal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoPoliza'
        '202':
          description: Se está generando. Reintentar tras `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
                example: 2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoPoliza'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La póliza no está emitida (`codigo = POLIZA_NO_EMITIDA`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaPoliza'
        '503':
          $ref: '#/components/responses/NoDisponible'
      security:
      - clienteAuth: []

components:

  securitySchemes:
    clienteAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de Identity Platform obtenido en `/v1/registro` o `/v1/sesiones`.
    consolaAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token de la sesión del personal, obtenido en `/v1/backoffice/sesiones` (`typ: consola`).'
    identityPlatformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ID token de Identity Platform tal cual lo emite (no la sesión propia del
        BFF). El BFF lo valida contra Identity Platform, no localmente — se usa
        solo en el reenvío del correo de activación
        (`/v1/registro/reenvio-confirmacion`), donde el cliente puede no tener aún
        una sesión del BFF completamente confirmada.

  parameters:
    PolizaId:
      name: polizaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EstadoPolizaFiltro:
      name: estado
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/EstadoPoliza'
    Mercado:
      name: mercado
      in: query
      required: true
      schema: { type: string, enum: [CO] }
    Idioma:
      name: idioma
      in: query
      required: false
      schema: { type: string, pattern: '^[a-z]{2}-[A-Z]{2}$', default: es-CO, examples: [es-CO] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Clave de idempotencia para reintentar el registro sin duplicar. Genere una
        clave por intento de registro y reutilícela solo al reintentar ese mismo intento.
      schema: { type: string, maxLength: 64 }

  responses:
    Prohibido:
      description: El cliente no está `ACTIVO` (`codigo = CLIENTE_NO_ACTIVO`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    NoAutenticado:
      description: Falta el token o no es válido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    FueraDeRango:
      description: Edad o plazo fuera de rango (`codigo = FUERA_DE_RANGO`). No se crea la solicitud.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    NoDisponible:
      description: 'Un servicio del que depende la operación no responde: Cotización al solicitar

        (`codigo = COTIZACION_NO_DISPONIBLE`; no se emite nada) o el de documentos al pedir el

        documento (`codigo = DOCUMENTO_NO_DISPONIBLE`). Reintentar.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    ConflictoPoliza:
      description: '`SIN_COTIZACION` (el cliente no tiene cotización activa), `COTIZACION_VENCIDA`,

        `COTIZACION_CAMBIO` (la activa no es la que el cliente vio: volver a mostrarla),

        `SOLICITUD_EXISTENTE` (ya hay una solicitud de esa cotización con otras coberturas) o

        `SOLICITUD_RECHAZADA` (esa solicitud fue rechazada por un agente).

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    SolicitudInvalida:
      description: Solicitud mal formada o con validación de esquema fallida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }
          examples:
            camposInvalidos:
              summary: Campos que no cumplen el esquema
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: La solicitud no cumple el esquema
                instance: https://dev.solventa4bits.com/web/v1/registro
                errores:
                  - campo: body.email
                    mensaje: String should match pattern '^[^@\s]+@[^@\s]+\.[^@\s]+$'
                  - campo: body.password
                    mensaje: String should have at least 10 characters
            campoFaltante:
              summary: Falta un campo obligatorio
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: La solicitud no cumple el esquema
                instance: https://dev.solventa4bits.com/web/v1/registro
                errores:
                  - campo: body.primerApellido
                    mensaje: Field required
    NoAutorizado:
      description: Falta el token, está expirado o es inválido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            sinToken:
              summary: No se envió el encabezado Authorization
              value:
                type: about:blank
                title: No autorizado
                status: 401
                detail: falta el encabezado Authorization
                instance: https://dev.solventa4bits.com/web/v1/cuenta
            tokenExpirado:
              summary: El token ya venció
              value:
                type: about:blank
                title: No autorizado
                status: 401
                detail: token expirado
                instance: https://dev.solventa4bits.com/web/v1/cuenta
            credencialesInvalidas:
              summary: Correo o contraseña incorrectos (inicio de sesión)
              value:
                type: about:blank
                title: No autorizado
                status: 401
                detail: credenciales inválidas
                instance: https://dev.solventa4bits.com/web/v1/sesiones
    Conflicto:
      description: El correo o el documento ya están registrados. `errores[0].campo` dice cuál.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaConflicto' }
          examples:
            correoRegistrado:
              summary: El correo ya tiene una cuenta
              value:
                type: about:blank
                title: Conflicto
                status: 409
                detail: El correo ya está registrado
                instance: https://dev.solventa4bits.com/web/v1/registro
                errores:
                  - campo: correo
                    mensaje: El correo ya está registrado
            documentoRegistrado:
              summary: El documento ya pertenece a un cliente
              value:
                type: about:blank
                title: Conflicto
                status: 409
                detail: El documento ya está registrado
                instance: https://dev.solventa4bits.com/web/v1/registro
                errores:
                  - campo: documento
                    mensaje: El documento ya está registrado
    EntidadNoProcesable:
      description: La solicitud es válida pero incumple una regla de negocio.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            enlaceInvalido:
              summary: El código del enlace de verificación ya se usó, venció o no es válido
              value:
                type: about:blank
                title: Regla de negocio no satisfecha
                status: 422
                detail: El enlace de confirmación no es válido, ya se usó o venció
                instance: https://dev.solventa4bits.com/web/v1/registro/confirmacion
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            cotizacionNoExiste:
              summary: La cotización no existe o no es del cliente
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: Cotización no encontrada
                instance: https://dev.solventa4bits.com/web/v1/cotizaciones/7c9e6679-7425-40de-944b-e07fc1f90ae7
            consentimientoNoExiste:
              summary: El consentimiento no existe
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: Consentimiento no encontrado
                instance: https://dev.solventa4bits.com/web/v1/cuenta/consentimientos/OPEN_FINANCE
    DependenciaNoDisponible:
      description: Una dependencia aguas abajo (Identity Platform / CoreTransaccional / Cotización y Rating / Productos y Configuración de Mercado) no respondió a tiempo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            dependenciaLenta:
              summary: CoreTransaccional no respondió a tiempo
              value:
                type: about:blank
                title: Dependencia no disponible
                status: 503
                detail: timeout esperando respuesta de svc-core
                instance: https://dev.solventa4bits.com/web/v1/registro

  schemas:
    SolicitarPolizaRequest:
      type: object
      additionalProperties: false
      required:
      - coberturas
      - cotizacionCreadaEn
      - documentosAceptados
      properties:
        coberturas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CodigoCobertura'
          description: Debe incluir `VIDA` (obligatoria). `HOGAR` es opcional.
        cotizacionCreadaEn:
          type: string
          format: date-time
          description: '`creadaEn` de la cotización que el cliente tiene en pantalla. Si no coincide con la

            activa, responde 409 `COTIZACION_CAMBIO`: el cliente no paga un precio que no vio.

            '
        documentosAceptados:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentoAceptadoEntrada'
          description: 'Documentos legales que la interfaz mostró y el cliente aceptó. Debe incluir el tipo

            `poliza`. Se guardan con fecha de aceptación. No se valida que la versión exista en

            Productos, igual que las versiones de política del registro.

            '
    ClienteSocio:
      type: object
      additionalProperties: false
      required: [id, nombre, tipoDocumento, ultimosDigitosDocumento, estado]
      properties:
        id: { type: string }
        nombre: { type: string }
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumento' }
        ultimosDigitosDocumento: { type: string, minLength: 1, maxLength: 4 }
        estado: { $ref: '#/components/schemas/EstadoCliente' }
    CrearClienteSocioRequest:
      type: object
      additionalProperties: false
      required: [tipoDocumento, numeroDocumento, primerNombre, primerApellido, fechaNacimiento, email, telefono]
      properties:
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumento' }
        numeroDocumento: { type: string, minLength: 4, maxLength: 20, pattern: '^[0-9A-Za-z-]+$' }
        primerNombre: { type: string, minLength: 1, maxLength: 60 }
        segundoNombre: { type: [string, 'null'], maxLength: 60 }
        primerApellido: { type: string, minLength: 1, maxLength: 60 }
        segundoApellido: { type: [string, 'null'], maxLength: 60 }
        fechaNacimiento: { type: string, format: date }
        email: { type: string, format: email, maxLength: 254 }
        telefono: { type: string, pattern: '^\+?[0-9]{7,15}$' }
    PrecioVentaRequest:
      type: object
      additionalProperties: false
      required: [clienteId, valorCredito, plazoRestanteMeses, entidadAcreedora]
      properties:
        clienteId: { type: string, minLength: 1, maxLength: 64 }
        valorCredito: { type: number, minimum: 10000000, description: El crédito es nuevo, así que el saldo es este valor. }
        plazoRestanteMeses: { type: integer, minimum: 1, maximum: 480 }
        entidadAcreedora: { type: string, minLength: 2, maxLength: 80, description: Nombre del banco, de `GET /v1/socio/entidades-financieras`. }
    VentaRequest:
      type: object
      additionalProperties: false
      required: [clienteId, valorCredito, plazoRestanteMeses, entidadAcreedora, coberturas, cuotaMensual, direccion, municipio]
      properties:
        clienteId: { type: string, minLength: 1, maxLength: 64 }
        valorCredito: { type: number, minimum: 10000000 }
        plazoRestanteMeses: { type: integer, minimum: 1, maximum: 480 }
        entidadAcreedora: { type: string, minLength: 2, maxLength: 80 }
        coberturas:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/CodigoCobertura' }
          description: Debe incluir `VIDA`.
        cuotaMensual: { type: number, exclusiveMinimum: 0, description: Cuota mensual del crédito. }
        direccion: { type: string, minLength: 1, maxLength: 200, description: Dirección del inmueble. }
        municipio: { type: string, minLength: 1, maxLength: 200 }
    PrecioVenta:
      type: object
      additionalProperties: false
      required: [edad, datosCredito, origenDatos, coberturaMeses, coberturas, vigenciaCotizacion, creadaEn]
      properties:
        edad: { type: integer }
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }
        origenDatos: { $ref: '#/components/schemas/OrigenDatos' }
        coberturaMeses: { type: integer }
        coberturas:
          type: array
          items: { $ref: '#/components/schemas/CoberturaContratada' }
        vigenciaCotizacion: { $ref: '#/components/schemas/Vigencia' }
        creadaEn: { type: string, format: date-time }
    DatosVenta:
      type: object
      additionalProperties: false
      required: [direccion, municipio, cuotaMensual]
      properties:
        direccion: { type: string }
        municipio: { type: string }
        cuotaMensual: { type: number }
    Venta:
      description: La póliza emitida, con quién la vendió y lo que el socio capturó.
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/Poliza'
      - type: object
        required: [clienteId, socioId, datosVenta]
        properties:
          clienteId: { type: string }
          socioId: { type: string }
          datosVenta: { $ref: '#/components/schemas/DatosVenta' }
    ProblemaConsola:
      allOf:
      - $ref: '#/components/schemas/Problema'
      - type: object
        properties:
          codigo:
            type: string
            enum:
            - ACCESO_POR_PORTAL_CLIENTE
            - CUENTA_SIN_ROL
            - ROL_NO_PERMITIDO
    SesionConsola:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, refreshToken, rol]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Segundos de vigencia del accessToken. }
        refreshToken: { type: string }
        rol: { $ref: '#/components/schemas/RolConsola' }
        nombre:
          type: [string, 'null']
          description: Nombre de la cuenta. Para un `SOCIO` es el que ve el cliente.
    RolConsola:
      type: string
      enum: [ADMIN, SOCIO]
    CrearUsuarioRequest:
      type: object
      additionalProperties: false
      required: [correo, contrasena, rol]
      properties:
        correo: { type: string, format: email, maxLength: 254 }
        contrasena: { type: string, format: password, minLength: 10, maxLength: 128 }
        rol: { $ref: '#/components/schemas/RolConsola' }
        nombre: { type: string, maxLength: 100 }
    Usuario:
      type: object
      additionalProperties: false
      required: [uid, correo, rol]
      properties:
        uid: { type: string }
        correo: { type: string }
        rol: { $ref: '#/components/schemas/RolConsola' }
    ProblemaPoliza:
      allOf:
      - $ref: '#/components/schemas/Problema'
      - type: object
        properties:
          codigo:
            type: string
            enum:
            - CLIENTE_NO_ACTIVO
            - SIN_COTIZACION
            - COTIZACION_VENCIDA
            - COTIZACION_CAMBIO
            - COTIZACION_NO_DISPONIBLE
            - FUERA_DE_RANGO
            - SOLICITUD_EXISTENTE
            - SOLICITUD_RECHAZADA
            - POLIZA_NO_EMITIDA
            - POLIZA_NO_PENDIENTE
            - SOLICITUD_VENCIDA
            - PENDIENTE_NO_APLICA
            - DOCUMENTO_NO_DISPONIBLE
            - DOCUMENTOS_LEGALES_NO_DISPONIBLES
    Poliza:
      type: object
      required:
      - polizaId
      - estado
      - producto
      - creadaEn
      - coberturas
      - primaTotalMensual
      - moneda
      - datosCredito
      - origenDatos
      - cotizacionCreadaEn
      - pendientes
      - documento
      properties:
        polizaId:
          type: string
          format: uuid
        numero:
          type:
          - string
          - 'null'
          example: SOL-VH-2026-K7M2Q9
          description: Solo cuando está `EMITIDA`.
        estado:
          $ref: '#/components/schemas/EstadoPoliza'
        producto:
          type: string
          enum:
          - VIDA_HIPOTECARIO
        creadaEn:
          type: string
          format: date-time
        emitidaEn:
          type:
          - string
          - 'null'
          format: date-time
        solicitudVigenteHasta:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Fin de la vigencia de la cotización atada. Una solicitud `PENDIENTE` pasa a `VENCIDA`

            después de esta fecha. `null` si está `EMITIDA`.

            '
        vigencia:
          oneOf:
          - $ref: '#/components/schemas/Vigencia'
          - type: 'null'
          description: Vigencia de la cobertura; solo cuando está `EMITIDA`.
        coberturas:
          type: array
          items:
            $ref: '#/components/schemas/CoberturaContratada'
        primaTotalMensual:
          type: number
        moneda:
          type: string
          enum:
          - COP
        datosCredito:
          $ref: '#/components/schemas/DatosCredito'
        origenDatos:
          $ref: '#/components/schemas/OrigenDatos'
        cotizacionCreadaEn:
          type: string
          format: date-time
        pendientes:
          type: array
          description: Vacía cuando está `EMITIDA`.
          items:
            $ref: '#/components/schemas/Pendiente'
        documento:
          $ref: '#/components/schemas/EstadoDocumento'
        documentosAceptados:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoAceptado'
        rechazo:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - motivos
          - rechazadaEn
          description: Solo cuando está `RECHAZADA`.
          properties:
            motivos:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - codigo
                - mensaje
                properties:
                  codigo:
                    $ref: '#/components/schemas/CodigoPendienteDeAgente'
                  mensaje:
                    type: string
                    description: Texto fijo del escenario
                    listo para mostrar.: null
            rechazadaEn:
              type: string
              format: date-time
    CoberturaContratada:
      type: object
      additionalProperties: false
      required:
      - codigo
      - obligatoria
      - sumaAsegurada
      - primaNeta
      - iva
      - primaTotal
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoCobertura'
        obligatoria:
          type: boolean
        sumaAsegurada:
          type: number
        primaNeta:
          type: number
        iva:
          type: number
        primaTotal:
          type: number
    CodigoCobertura:
      type: string
      enum:
      - VIDA
      - HOGAR
    CodigoPendienteDeAgente:
      type: string
      enum:
      - EVIDENCIA_EN_REVISION
      - CREDITO_NO_VERIFICADO
    OrigenDatos:
      type: string
      enum:
      - CONFIRMADO
      - DECLARADO
      description: '`CONFIRMADO` si el crédito coincide exactamente con una hipoteca reportada por Open Finance;

        `DECLARADO` en cualquier otro caso.

        '
    DocumentoAceptado:
      type: object
      additionalProperties: false
      required:
      - tipo
      - version
      - aceptadoEn
      properties:
        tipo:
          type: string
          enum:
          - poliza
        version:
          type: string
        aceptadoEn:
          type: string
          format: date-time
    Pendiente:
      type: object
      additionalProperties: false
      required:
      - codigo
      - tipo
      - mensaje
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoPendiente'
        tipo:
          $ref: '#/components/schemas/TipoPendiente'
        mensaje:
          type: string
          description: Texto listo para mostrar al cliente.
        detalle:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            evidencias:
              type: array
              items:
                $ref: '#/components/schemas/TipoEvidencia'
              description: En `EVIDENCIA_FALTANTE` y `EVIDENCIA_EN_REVISION`, cuáles.
    DocumentoAceptadoEntrada:
      type: object
      additionalProperties: false
      required:
      - tipo
      - version
      properties:
        tipo:
          type: string
          enum:
          - poliza
        version:
          type: string
          pattern: ^V[0-9]+$
          description: Versión del documento legal mostrada (inmutable en Productos), por ejemplo `V1`.
    EstadoPoliza:
      type: string
      enum:
      - PENDIENTE
      - EMITIDA
      - RECHAZADA
      - VENCIDA
      description: '`VENCIDA` se deriva al leer; no se guarda.'
    TipoPendiente:
      type: string
      enum:
      - USUARIO
      - AGENTE
    EstadoDocumento:
      type: object
      additionalProperties: false
      required:
      - estado
      properties:
        estado:
          type: string
          enum:
          - NO_DISPONIBLE
          - DISPONIBLE
          description: '`DISPONIBLE`: la póliza está emitida y ya se puede pedir el documento (si todavía
            se

            está generando, `GET .../documento` responde 202). `NO_DISPONIBLE`: aún no está emitida.

            '
    DocumentoPoliza:
      type: object
      additionalProperties: false
      required:
      - estado
      properties:
        estado:
          type: string
          enum:
          - GENERANDO
          - LISTO
        url:
          type:
          - string
          - 'null'
          format: uri
          description: Enlace temporal; solo con `LISTO`.
        expiraEn:
          type:
          - string
          - 'null'
          format: date-time
    CodigoPendiente:
      type: string
      enum:
      - CORREO_SIN_CONFIRMAR
      - EVIDENCIA_FALTANTE
      - EVIDENCIA_EN_REVISION
      - CREDITO_NO_VERIFICADO

    RegistroRequest:
      type: object
      additionalProperties: false
      required: [email, password, tipoDocumento, numeroDocumento, primerNombre, primerApellido, fechaNacimiento, telefono, politicaVersion, aceptaTerminos, autorizaTratamientoDatos, autorizaDatosFinancieros]
      examples:
        - email: ana.rios@example.com
          password: Clave-Segura-2026
          tipoDocumento: CC
          numeroDocumento: '1032456789'
          primerNombre: Ana
          segundoNombre: María
          primerApellido: Ríos
          segundoApellido: Gómez
          fechaNacimiento: '1990-03-15'
          telefono: '+573001234567'
          politicaVersion: v1
          aceptaTerminos: true
          autorizaTratamientoDatos: true
          politicaVersionTratamientoDatos: v1
          autorizaDatosFinancieros: true
          politicaVersionDatosFinancieros: v1
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumento' }
        numeroDocumento: { type: string, minLength: 4, maxLength: 20, pattern: '^[0-9A-Za-z-]+$' }
        primerNombre: { type: string, minLength: 1, maxLength: 60 }
        segundoNombre: { type: [string, 'null'], maxLength: 60 }
        primerApellido: { type: string, minLength: 1, maxLength: 60 }
        segundoApellido: { type: [string, 'null'], maxLength: 60 }
        fechaNacimiento: { type: string, format: date }
        telefono: { type: string, pattern: '^\+?[0-9]{7,15}$', description: Celular de contacto (obligatorio). }
        politicaVersion: { type: string, maxLength: 20, description: Versión de términos y política de datos aceptada. }
        aceptaTerminos:
          type: boolean
          const: true
          description: Debe ser true; el cliente aceptó términos y política de tratamiento de datos.
        autorizaTratamientoDatos:
          type: boolean
          description: |
            Consentimiento OPEN_DATA / tratamiento de datos personales. `false`
            no bloquea el registro; solo deja el consentimiento en `NO_OTORGADO`.
        politicaVersionTratamientoDatos:
          type: [string, 'null']
          maxLength: 20
          description: Versión del aviso de tratamiento de datos aceptado. Solo aplica si se autoriza.
        autorizaDatosFinancieros:
          type: boolean
          description: |
            Consentimiento OPEN_FINANCE (BITS-93 AC-9). `false` no bloquea el
            registro — al cotizar, el precio se calcula solo con los datos que
            el cliente aporte.
        politicaVersionDatosFinancieros:
          type: [string, 'null']
          maxLength: 20
          description: Versión de la autorización de datos financieros aceptada. Solo aplica si se autoriza.

    ConfirmacionRequest:
      type: object
      additionalProperties: false
      required: [oobCode]
      properties:
        oobCode:
          type: string
          minLength: 10
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
          description: Código de un solo uso del enlace de verificación (parámetro `oobCode` de la URL).
          examples: [AbCdEf0123456789_-xYz]

    RegistroResponse:
      type: object
      additionalProperties: false
      required: [cuenta, sesion]
      examples:
        - cuenta:
            clienteId: 3f2b8c1e-7d4a-4e5b-9a61-2c8d5f0b7e14
            primerNombre: Ana
            segundoNombre: María
            primerApellido: Ríos
            segundoApellido: Gómez
            email: ana.rios@example.com
            telefono: '+573001234567'
            estado: ACTIVO
            correoConfirmado: false
          sesion:
            accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6IjEifQ.eyJzdWIiOiJhbmEifQ.c2lnbmF0dXJh
            tokenType: Bearer
            expiresIn: 3600
            refreshToken: AMf-vBzQ7Xk2nH4wT9pLr0eYd
      properties:
        cuenta: { $ref: '#/components/schemas/Cuenta' }
        sesion: { $ref: '#/components/schemas/Sesion' }

    CredencialesRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      examples:
        - email: ana.rios@example.com
          password: Clave-Segura-2026
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    Sesion:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, refreshToken]
      examples:
        - accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6IjEifQ.eyJzdWIiOiJhbmEifQ.c2lnbmF0dXJh
          tokenType: Bearer
          expiresIn: 3600
          refreshToken: AMf-vBzQ7Xk2nH4wT9pLr0eYd
      properties:
        accessToken: { type: string, description: JWT de Identity Platform. }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Segundos de vigencia del accessToken. }
        refreshToken: { type: string }

    Cuenta:
      type: object
      additionalProperties: false
      required: [clienteId, primerNombre, primerApellido, email, telefono, estado, correoConfirmado]
      examples:
        - clienteId: 3f2b8c1e-7d4a-4e5b-9a61-2c8d5f0b7e14
          primerNombre: Ana
          segundoNombre: María
          primerApellido: Ríos
          segundoApellido: Gómez
          email: ana.rios@example.com
          telefono: '+573001234567'
          estado: ACTIVO
          correoConfirmado: true
      properties:
        clienteId: { type: string, format: uuid }
        primerNombre: { type: string }
        segundoNombre: { type: [string, 'null'] }
        primerApellido: { type: string }
        segundoApellido: { type: [string, 'null'] }
        email: { type: string, format: email }
        telefono: { type: string }
        estado: { $ref: '#/components/schemas/EstadoCliente' }
        correoConfirmado:
          type: boolean
          description: BITS-93 AC-3 — no condiciona cotización ni coberturas, solo la formalización del contrato.

    TipoDocumentoLegal:
      type: string
      enum: [terminos, open-data, open-finance, poliza]
      description: |
        - `terminos` — términos y condiciones y aviso de privacidad.
        - `open-data` — tratamiento de datos personales.
        - `open-finance` — consulta en centrales de riesgo (datos financieros).
        - `poliza` — condiciones de la póliza; se muestran al solicitarla, no en el registro.

    DocumentoLegal:
      type: object
      additionalProperties: false
      required: [tipo, version, titulo, baseLegal, contenido]
      examples:
        - tipo: open-finance
          version: V1
          titulo: Consulta en centrales de riesgo
          subtitulo: Es opcional. Si la das, tu precio puede bajar.
          baseLegal: Ley 1266 de 2008
          contenido: '<h3>1 · Qué autorizas</h3><p>Consultar y reportar tu comportamiento crediticio ante los operadores de información.</p><h3>2 · Puedes retirarla</h3><p>Quitas esta autorización cuando quieras desde tu perfil.</p>'
          notaPie: Es opcional. Si no la autorizas puedes seguir igual.
      properties:
        tipo: { $ref: '#/components/schemas/TipoDocumentoLegal' }
        version:
          type: string
          pattern: '^V[1-9][0-9]*$'
          description: Versión publicada (`V1`, `V2`, …). La web la envía de vuelta al registrar la aceptación.
        titulo: { type: string }
        subtitulo: { type: string, description: Se omite cuando no tiene. }
        baseLegal: { type: string, description: 'Ley que respalda el documento, por ejemplo `Ley 1581 de 2012`.' }
        contenido:
          type: string
          description: |
            Cuerpo del documento con formato (HTML).
            Etiquetas permitidas: `h3`, `p`, `ul`, `ol`, `li`, `strong`, `em`, `a`, `span`.
            Atributos permitidos: `href` en `a` (solo esquemas `https` y `mailto`) y
            `class` (solo valores con prefijo `legal-`, por ejemplo `legal-highlight`).
            No se permiten `style`, `script`, etiquetas de estilo, imágenes ni
            manejadores de eventos. La web define el significado visual de cada clase
            `legal-*` y debe sanear el HTML con esta misma lista antes de pintarlo.
        notaPie: { type: string, description: Texto de pie del documento. Se omite cuando no tiene. }

    Disponibilidad:
      type: object
      additionalProperties: false
      examples:
        - correoDisponible: false
          documentoDisponible: true
      properties:
        correoDisponible: { type: [boolean, 'null'], description: 'null si no se consultó correo.' }
        documentoDisponible: { type: [boolean, 'null'], description: 'null si no se consultó documento.' }

    OtorgarConsentimientoRequest:
      type: object
      additionalProperties: false
      required: [scope, politicaVersion]
      examples:
        - scope: OPEN_FINANCE
          politicaVersion: v1
      properties:
        scope: { $ref: '#/components/schemas/ConsentimientoScope' }
        politicaVersion: { type: string, maxLength: 20 }

    ConsentimientoVista:
      type: object
      additionalProperties: false
      required: [scope, estado, vigente]
      examples:
        - scope: OPEN_FINANCE
          estado: OTORGADO
          vigente: true
          actualizadoEn: '2026-10-06T14:32:10Z'
      properties:
        scope: { $ref: '#/components/schemas/ConsentimientoScope' }
        estado: { $ref: '#/components/schemas/EstadoConsentimientoEnum' }
        vigente: { type: boolean }
        actualizadoEn: { type: [string, 'null'], format: date-time }

    DatosCredito:
      type: object
      additionalProperties: false
      required: [valorCredito, plazoRestanteMeses, entidadAcreedora, saldoInsoluto]
      properties:
        valorCredito: { type: number, minimum: 10000000 }
        plazoRestanteMeses:
          type: integer
          minimum: 1
          maximum: 480
          description: Meses que le faltan al crédito. Con la edad, no puede pasar de los 75 años.
        entidadAcreedora: { type: string, minLength: 2, maxLength: 80 }
        saldoInsoluto: { type: number, exclusiveMinimum: 0 }

    CotizacionRequest:
      type: object
      additionalProperties: false
      required: [datosCredito]
      examples:
        - datosCredito:
            valorCredito: 250000000
            plazoRestanteMeses: 180
            entidadAcreedora: Bancolombia
            saldoInsoluto: 238500000
      properties:
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }

    FactorRiesgo:
      type: object
      additionalProperties: false
      required: [descripcion, efecto]
      properties:
        descripcion: { type: string }
        efecto: { type: string, enum: [POSITIVO, NEGATIVO] }
        pesoRelativo: { type: [number, 'null'] }

    PerfilRiesgo:
      type: object
      additionalProperties: false
      required: [nivelRiesgo, factores]
      properties:
        nivelRiesgo: { type: string, enum: [BAJO, MEDIO, ALTO] }
        factores:
          type: array
          items: { $ref: '#/components/schemas/FactorRiesgo' }

    Oferta:
      type: object
      additionalProperties: false
      required: [primaMensual, primaBaseMensual, sumaAsegurada, coberturaMeses, moneda, personalizado, desglose]
      properties:
        primaMensual: { type: number }
        primaBaseMensual: { type: number }
        sumaAsegurada: { type: number }
        coberturaMeses: { type: integer }
        moneda: { type: string, const: COP }
        personalizado: { type: boolean }
        fuentesNoDisponibles:
          type: array
          items: { type: string }
        desglose: { $ref: '#/components/schemas/Desglose' }

    CoberturaPrecio:
      type: object
      additionalProperties: false
      required: [codigo, obligatoria, sumaAsegurada, primaNeta, iva, primaTotal]
      properties:
        codigo: { type: string, enum: [VIDA, HOGAR] }
        obligatoria: { type: boolean, description: true para VIDA, false para HOGAR. }
        sumaAsegurada:
          type: number
          description: "VIDA: saldo insoluto. HOGAR: min(240.000.000, valorCredito)."
        primaNeta: { type: number, description: Prima mensual sin IVA. }
        iva: { type: number, description: IVA mensual. 0 en VIDA; 19 % de primaNeta en HOGAR. }
        primaTotal: { type: number, description: Prima mensual con IVA (primaNeta + iva). }

    Desglose:
      type: object
      additionalProperties: false
      required: [coberturas]
      description: |
        Precio de cada cobertura. No trae totales: el servicio no guarda la selección del
        cliente, así que el front suma los `primaNeta`, `iva` y `primaTotal` de las coberturas
        que el cliente elija. HOGAR es opcional y no viene marcada por defecto.
      properties:
        coberturas:
          type: array
          items: { $ref: '#/components/schemas/CoberturaPrecio' }

    Vigencia:
      type: object
      additionalProperties: false
      required: [desde, hasta]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }

    EntidadFinanciera:
      type: object
      additionalProperties: false
      required: [id, nombre]
      properties:
        id: { type: string, examples: [bancolombia] }
        nombre: { type: string, examples: [Bancolombia] }

    CreditoHipotecario:
      type: object
      additionalProperties: false
      required: [entidadNombre, valorCredito, saldoInsoluto, plazoRestanteMeses, cuotaMensual]
      properties:
        entidadId:
          type: string
          description: Entidad del mercado a la que corresponde. Ausente si el banco no está en la lista.
        entidadNombre:
          type: string
          description: Nombre de la entidad para mostrar.
        valorCredito: { type: number, description: Monto total del crédito, en COP. }
        saldoInsoluto: { type: number, description: Saldo a hoy, en COP. }
        plazoRestanteMeses: { type: integer, minimum: 1, description: Meses que faltan. }
        cuotaMensual: { type: number, description: Cuota mensual, en COP. }

    CreditosHipotecarios:
      type: object
      additionalProperties: false
      required: [estado, creditos, entidades, origen]
      examples:
        - estado: DISPONIBLE
          origen: OPEN_FINANCE
          fechaConsulta: '2026-10-09T12:00:00Z'
          creditos:
            - entidadId: bancolombia
              entidadNombre: Bancolombia
              valorCredito: 380000000
              saldoInsoluto: 320000000
              plazoRestanteMeses: 180
              cuotaMensual: 3100000
          entidades:
            - { id: bancolombia, nombre: Bancolombia }
            - { id: davivienda, nombre: Davivienda }
      properties:
        estado:
          type: string
          enum: [DISPONIBLE, SIN_HIPOTECAS, SIN_CONSENTIMIENTO, NO_DISPONIBLE]
        creditos:
          type: array
          items: { $ref: '#/components/schemas/CreditoHipotecario' }
        entidades:
          type: array
          items: { $ref: '#/components/schemas/EntidadFinanciera' }
          description: Bancos del mercado, en el orden en que se presentan.
        origen:
          type: string
          enum: [OPEN_FINANCE]
        fechaConsulta:
          type: string
          format: date-time
          description: Cuándo se trajeron los datos de la fuente. Ausente si no hay datos.

    Cotizacion:
      type: object
      additionalProperties: false
      required: [estado, producto, datosCredito, origenDatos, oferta, vigenciaCotizacion, creadaEn]
      examples:
        - estado: VIGENTE
          producto: VIDA_HIPOTECARIO
          datosCredito:
            valorCredito: 250000000
            plazoRestanteMeses: 180
            entidadAcreedora: Bancolombia
            saldoInsoluto: 238500000
          origenDatos: DECLARADO
          oferta:
            primaMensual: 39734
            primaBaseMensual: 46746
            sumaAsegurada: 238500000
            coberturaMeses: 180
            moneda: COP
            personalizado: true
            desglose:
              coberturas:
                - codigo: VIDA
                  obligatoria: true
                  sumaAsegurada: 238500000
                  primaNeta: 39734
                  iva: 0
                  primaTotal: 39734
                - codigo: HOGAR
                  obligatoria: false
                  sumaAsegurada: 240000000
                  primaNeta: 23760
                  iva: 4514
                  primaTotal: 28274
          perfilRiesgo:
            nivelRiesgo: BAJO
            factores:
              - descripcion: Historial de pagos excelente
                efecto: POSITIVO
                pesoRelativo: 0.1
              - descripcion: Endeudamiento bajo
                efecto: POSITIVO
                pesoRelativo: 0.2
          vigenciaCotizacion:
            desde: '2026-10-06T14:35:00Z'
            hasta: '2026-11-05T14:35:00Z'
          creadaEn: '2026-10-06T14:35:00Z'
      properties:
        estado: { type: string, enum: [VIGENTE, EXPIRADA] }
        producto: { type: string, const: VIDA_HIPOTECARIO }
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }
        origenDatos:
          type: string
          enum: [CONFIRMADO, DECLARADO]
          description: |
            De dónde salen los datos del crédito. `CONFIRMADO`: coinciden exactamente con una
            hipoteca que Open Finance reportó. `DECLARADO`: los escribió el cliente o no hay
            con qué compararlos.
        oferta: { $ref: '#/components/schemas/Oferta' }
        perfilRiesgo:
          oneOf:
            - { $ref: '#/components/schemas/PerfilRiesgo' }
            - type: 'null'
        vigenciaCotizacion: { $ref: '#/components/schemas/Vigencia' }
        creadaEn: { type: string, format: date-time }

    TipoDocumento:
      type: string
      enum: [CC, CE, PA]
    EstadoCliente:
      type: string
      enum: [ACTIVO, BLOQUEADO, INACTIVO]
    ConsentimientoScope:
      type: string
      enum: [OPEN_FINANCE, OPEN_DATA]
    EstadoConsentimientoEnum:
      type: string
      enum: [OTORGADO, REVOCADO, NO_OTORGADO]

    TipoEvidencia:
      type: string
      enum: [cedula_frente, cedula_reverso, selfie]
    EstadoVeredicto:
      type: string
      enum: [ACEPTADA, REINTENTAR, REVISION_MANUAL]
    MotivoRechazo:
      type: string
      enum:
        - BORROSA
        - OSCURA
        - REFLEJO
        - RECORTADA
        - NO_ES_CEDULA
        - SIN_ROSTRO
        - VARIOS_ROSTROS
        - POSIBLE_SUPLANTACION
        - NO_COINCIDE_CON_CEDULA
      description: |
        Qué corregir al repetir la foto. `REFLEJO` incluye demasiada luz en toda la foto,
        `BORROSA` incluye una foto con muy pocos píxeles, y `NO_ES_CEDULA` es que no se
        reconoció una tarjeta con la proporción de una cédula.

        Los cuatro últimos son de la selfie: `SIN_ROSTRO` (no se ve un rostro, o se ve muy
        pequeño), `VARIOS_ROSTROS` (hay más de una persona), `POSIBLE_SUPLANTACION` (no parece
        una persona real: foto de una foto o de una pantalla) y `NO_COINCIDE_CON_CEDULA` (el
        rostro no se parece al de la cédula). Los clientes deben tolerar motivos que no
        conozcan.

    SubirEvidenciaRequest:
      type: object
      required: [tipo, imagen]
      properties:
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        imagen: { type: string, format: binary, description: Foto en JPEG o PNG, máximo 3 MB. }

    EvidenciaSubida:
      type: object
      additionalProperties: false
      required: [tipo, estado, intentosRestantes]
      examples:
        - { evidenciaId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, tipo: cedula_frente, estado: ACEPTADA, motivo: null, intentosRestantes: 3 }
        - { evidenciaId: null, tipo: cedula_reverso, estado: REINTENTAR, motivo: REFLEJO, intentosRestantes: 2 }
      properties:
        evidenciaId:
          type: [string, 'null']
          format: uuid
          description: "`null` con `REINTENTAR`: no se guardó nada."
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        estado: { $ref: '#/components/schemas/EstadoVeredicto' }
        motivo:
          oneOf:
            - { $ref: '#/components/schemas/MotivoRechazo' }
            - { type: 'null' }
          description: Solo con `REINTENTAR`.
        intentosRestantes:
          type: integer
          minimum: 0
          description: Rechazos que quedan antes de pasar a revisión manual. Se reinicia al guardar una evidencia.

    EstadoEvidencia:
      type: object
      additionalProperties: false
      required: [tipo, estado, intentosRestantes]
      properties:
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        estado: { type: string, enum: [ACEPTADA, REVISION_MANUAL, PENDIENTE] }
        evidenciaId: { type: [string, 'null'], format: uuid }
        creadaEn: { type: [string, 'null'], format: date-time }
        intentosRestantes: { type: integer, minimum: 0 }

    Problema:
      description: Error en formato RFC 9457 (Problem Details for HTTP APIs).
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
      examples:
        - type: about:blank
          title: Conflicto
          status: 409
          detail: El correo ya está registrado
          instance: https://dev.solventa4bits.com/web/v1/registro

    ProblemaConflicto:
      description: |
        `Problema` de un conflicto de registro (`409`). `errores` trae un único elemento
        con el campo repetido.
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          required: [errores]
          properties:
            errores:
              type: array
              minItems: 1
              items:
                type: object
                required: [campo, mensaje]
                properties:
                  campo: { type: string, enum: [correo, documento] }
                  mensaje: { type: string }
      examples:
        - type: about:blank
          title: Conflicto
          status: 409
          detail: El correo ya está registrado
          instance: https://dev.solventa4bits.com/web/v1/registro
          errores:
            - campo: correo
              mensaje: El correo ya está registrado

    ProblemaValidacion:
      description: |
        `Problema` con el detalle campo por campo. Solo lo devuelve la validación
        del esquema de la solicitud (`400`); el resto de errores no lleva `errores`.
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            errores:
              type: array
              items:
                type: object
                properties:
                  campo: { type: string, description: Ruta del campo con error, por ejemplo `body.email`. }
                  mensaje: { type: string }
      examples:
        - type: about:blank
          title: Solicitud inválida
          status: 400
          detail: La solicitud no cumple el esquema
          instance: https://dev.solventa4bits.com/web/v1/registro
          errores:
            - campo: body.email
              mensaje: String should match pattern '^[^@\s]+@[^@\s]+\.[^@\s]+$'
            - campo: body.password
              mensaje: String should have at least 10 characters

    TipoSiniestro:
      type: string
      enum: [INCAPACIDAD_TOTAL, INCENDIO_TERREMOTO, SISMO_PARAMETRICO]
      description: |
        `INCAPACIDAD_TOTAL` es de la cobertura Vida e `INCENDIO_TERREMOTO` de Tu casa.
        `SISMO_PARAMETRICO` lo crea el pago automático por sismo (Tu casa): el cliente no lo reporta.

    EstadoSiniestro:
      type: string
      enum: [EN_ESTUDIO, FALTA_INFORMACION, PAGADO, RECHAZADO]

    ArchivoSiniestro:
      type: object
      additionalProperties: false
      required: [id, clase, entregadoEn]
      properties:
        id: { type: string, format: uuid }
        clase: { type: string, enum: [FOTO, DOCUMENTO] }
        capturadoEn: { type: [string, 'null'], format: date-time }
        latitud: { type: [number, 'null'] }
        longitud: { type: [number, 'null'] }
        entregadoEn:
          type: string
          format: date-time
          description: La fecha de la entrega en que llegó (el reporte o lo que se pidió después).

    EvidenciaPedida:
      type: object
      additionalProperties: false
      required: [detalle, pedidaEn]
      properties:
        detalle: { type: string, description: 'Lo que escribió Solventa, tal cual.' }
        pedidaEn: { type: string, format: date-time }

    LineaPago:
      type: object
      additionalProperties: false
      required: [beneficiario, valor, destino]
      properties:
        beneficiario: { type: string, enum: [BANCO, CLIENTE] }
        valor: { type: number }
        destino:
          type: string
          description: 'Texto listo para mostrar, p. ej. «Cuenta de ahorros terminada en 4821».'

    Pago:
      type: object
      additionalProperties: false
      required: [pagadoEn, lineas]
      description: La orden de pago simulada, una por siniestro, con una o dos líneas.
      properties:
        pagadoEn: { type: string, format: date-time }
        lineas:
          type: array
          items: { $ref: '#/components/schemas/LineaPago' }

    EventoSismo:
      type: object
      additionalProperties: false
      required: [fecha, municipio, magnitud]
      properties:
        fecha: { type: string, format: date }
        municipio: { type: string }
        magnitud: { type: number }

    SiniestroResumen:
      type: object
      additionalProperties: false
      required: [id, numero, polizaId, tipo, automatico, estado, reportadoEn, actualizadoEn]
      examples:
        - id: 3f2b8c1e-7d4a-4e5b-9a61-2c8d5f0b7e14
          numero: SIN-2026-7K3M9Q
          polizaId: 7c1f6a4e-2b8d-4d3a-9a55-0e3b1f2c8d10
          tipo: INCENDIO_TERREMOTO
          automatico: false
          estado: EN_ESTUDIO
          reportadoEn: '2026-11-10T15:02:00Z'
          actualizadoEn: '2026-11-10T15:02:00Z'
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        polizaId: { type: string }
        tipo: { $ref: '#/components/schemas/TipoSiniestro' }
        automatico: { type: boolean, description: '`true` en el pago automático por sismo.' }
        estado: { $ref: '#/components/schemas/EstadoSiniestro' }
        reportadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }

    Siniestro:
      type: object
      additionalProperties: false
      required:
        [id, numero, polizaId, tipo, automatico, estado, reportadoEn, actualizadoEn,
         fechaOcurrencia, ultimaEntregaEn, archivos]
      description: |
        El detalle de mi siniestro: los campos del resumen más el plazo, lo que Solventa pidió, el
        motivo del rechazo, la orden de pago y mis archivos.
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        polizaId: { type: string }
        tipo: { $ref: '#/components/schemas/TipoSiniestro' }
        automatico: { type: boolean, description: '`true` en el pago automático por sismo.' }
        estado: { $ref: '#/components/schemas/EstadoSiniestro' }
        reportadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        fechaOcurrencia: { type: string, format: date }
        narracion: { type: [string, 'null'] }
        ultimaEntregaEn: { type: string, format: date-time }
        fechaLimite:
          type: [string, 'null']
          format: date-time
          description: 'Solo en `EN_ESTUDIO`: la última entrega más un mes.'
        evidenciaPedida:
          oneOf:
            - { $ref: '#/components/schemas/EvidenciaPedida' }
            - { type: 'null' }
        motivoRechazo: { type: [string, 'null'] }
        pago:
          oneOf:
            - { $ref: '#/components/schemas/Pago' }
            - { type: 'null' }
        archivos:
          type: array
          items: { $ref: '#/components/schemas/ArchivoSiniestro' }
        evento:
          oneOf:
            - { $ref: '#/components/schemas/EventoSismo' }
            - { type: 'null' }
          description: Solo en el paramétrico.

    ProblemaSiniestro:
      allOf:
      - $ref: '#/components/schemas/Problema'
      - type: object
        properties:
          codigo:
            type: string
            enum: [ESTADO_NO_PERMITE, VALOR_SUPERA_SUMA_ASEGURADA]

    DestinoPago:
      description: Cómo recibe el pago el cliente, tal como lo eligió al reportar.
      oneOf:
        - type: object
          additionalProperties: false
          required: [tipo, banco, tipoCuenta, numeroCuenta]
          properties:
            tipo: { type: string, const: TRANSFERENCIA }
            banco: { type: string }
            tipoCuenta: { type: string, enum: [AHORROS, CORRIENTE] }
            numeroCuenta: { type: string }
        - type: object
          additionalProperties: false
          required: [tipo, oficina]
          properties:
            tipo: { type: string, const: CHEQUE }
            oficina:
              type: object
              additionalProperties: false
              required: [id, banco, nombre, direccion]
              properties:
                id: { type: string }
                banco: { type: string }
                nombre: { type: string }
                direccion: { type: string }

    PendienteResumen:
      type: object
      required: [codigo, tipo]
      properties:
        codigo: { $ref: '#/components/schemas/CodigoPendiente' }
        tipo: { $ref: '#/components/schemas/TipoPendiente' }

    SolicitudResumen:
      type: object
      required:
        [polizaId, clienteId, estado, creadaEn, primaTotalMensual, origenDatos, pendientes]
      properties:
        polizaId: { type: string, format: uuid }
        numero: { type: [string, 'null'] }
        clienteId: { type: string }
        estado: { $ref: '#/components/schemas/EstadoPoliza' }
        creadaEn: { type: string, format: date-time }
        solicitudVigenteHasta: { type: [string, 'null'], format: date-time }
        primaTotalMensual: { type: number }
        origenDatos: { $ref: '#/components/schemas/OrigenDatos' }
        pendientes:
          type: array
          items: { $ref: '#/components/schemas/PendienteResumen' }

    PaginaSolicitudes:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SolicitudResumen' }
        siguienteCursor:
          type: [string, 'null']
          description: El `cursor` de la página siguiente; `null` si no hay más.

    EvidenciaSolicitud:
      type: object
      required: [tipo, estado]
      properties:
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        estado: { type: string, enum: [ACEPTADA, REVISION_MANUAL, PENDIENTE] }
        evidenciaId:
          type: [string, 'null']
          format: uuid
          description: Con él se abre la foto en `/evidencias/{evidenciaId}`.

    DecisionSolicitud:
      type: object
      required: [decision, agente, pendientes, decididaEn]
      properties:
        decision: { type: string, enum: [APROBAR, RECHAZAR] }
        agente: { type: string, description: 'El correo de quien decidió.' }
        pendientes:
          type: array
          items: { $ref: '#/components/schemas/CodigoPendiente' }
        nota: { type: [string, 'null'] }
        decididaEn: { type: string, format: date-time }

    ClienteSolicitud:
      type: object
      required: [id, nombre, tipoDocumento, numeroDocumento]
      properties:
        id: { type: string }
        nombre: { type: string }
        tipoDocumento: { type: string, enum: [CC, CE, PA] }
        numeroDocumento: { type: string }

    Solicitud:
      allOf:
        - $ref: '#/components/schemas/Poliza'
        - type: object
          required: [clienteId, evidencias, decisiones]
          properties:
            clienteId: { type: string }
            evidencias:
              type: array
              items: { $ref: '#/components/schemas/EvidenciaSolicitud' }
            decisiones:
              type: array
              items: { $ref: '#/components/schemas/DecisionSolicitud' }

    SolicitudDetalle:
      allOf:
        - $ref: '#/components/schemas/Solicitud'
        - type: object
          required: [cliente]
          properties:
            cliente: { $ref: '#/components/schemas/ClienteSolicitud' }

    DecidirSolicitudRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [APROBAR, RECHAZAR] }
        pendientes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [EVIDENCIA_EN_REVISION, CREDITO_NO_VERIFICADO] }
          description: 'Obligatorio al aprobar: los pendientes que se verificaron. No se envía al rechazar.'
        motivo:
          type: string
          enum: [EVIDENCIA_EN_REVISION, CREDITO_NO_VERIFICADO]
          description: 'Obligatorio al rechazar, uno solo. No se envía al aprobar.'

    DecidirSiniestroRequest:
