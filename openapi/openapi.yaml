openapi: 3.1.3

info:
  title: BFF Web — Onboarding
  summary: API del canal web para registro y onboarding de clientes de Solventa.
  description: |
    Backend for Frontend del cliente web. Orquesta el *journey de originación*.

    Alcance de esta versión (`0.1.x`): **registro de cliente** (identidad + alta en
    CoreTransaccional), el paso de **consentimientos** y **cotización** (orquesta
    hacia Cotización y Rating; EXP-01, BITS-81). El paso de perfilamiento propio
    del BFF se agrega en versiones posteriores.

    Entrada real: `Cliente Web → Cloud LB → Cloud Armor (WAF) → API Gateway → BFF Web`.
    El API Gateway valida firma y expiración del token; el BFF valida identidad de
    negocio y scopes.

    Errores en formato **RFC 9457 (Problem Details)**, `application/problem+json`.
  version: 0.1.0
  contact:
    name: Equipo 4Bits
  license:
    name: Uso académico 4Bits

servers:
  - url: https://dev.solventa4bits.com/web
    description: Entorno de desarrollo

tags:
  - name: Registro
    description: Alta de una persona en la plataforma.
  - name: Sesión
    description: Inicio de sesión y refresco de token.
  - name: Cuenta
    description: Datos del cliente autenticado.
  - name: Consentimientos
    description: Consentimientos del cliente autenticado.
  - name: Cotización
    description: Cotización de seguro de vida sobre crédito hipotecario (orquesta hacia Cotización y Rating).
  - name: Documentos legales
    description: Textos legales versionados que el registro muestra antes de pedir la aceptación (los publica Productos y Configuración de Mercado).
  - name: Evidencias de identidad
    description: Cédula por ambas caras y selfie previas a la firma. Una foto por request; el servidor decide si sirve.

security:
  - clienteAuth: []

paths:
  /v1/registro:
    post:
      operationId: registrarse
      tags: [Registro]
      summary: Registra una persona y abre sesión
      description: |
        **Público** (no requiere token).

        Orquesta:
        1. Crea la credencial de autenticación en Identity Platform.
        2. Crea el cliente en CoreTransaccional (`POST /v1/clientes`) con el `identityRef`.
        3. Devuelve una sesión iniciada.

        Si el correo o el documento ya existen responde `409` y no deja nada creado
        (revierte la credencial si alcanzó a crearse). El campo repetido viaja en
        `errores[].campo` (`correo` o `documento`), sin revelar datos de otra persona.

        **Reintentos (`Idempotency-Key`).** Si el cliente reintenta con la misma clave
        porque perdió la respuesta, y envía el mismo correo y contraseña, recibe `201`
        con la cuenta ya creada y una sesión nueva, sin duplicar nada. Con otra
        contraseña, o sin clave, un correo ya registrado es un `409` normal.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroRequest' }
      responses:
        '201':
          description: Cliente creado y sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroResponse' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/EntidadNoProcesable' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/registro/disponibilidad:
    get:
      operationId: consultarDisponibilidad
      tags: [Registro]
      summary: Consulta si un correo y/o documento ya están registrados
      description: |
        **Público** (no requiere token). Chequeo de solo lectura para validar en
        vivo el formulario de registro (BITS-93) — proxya a CoreTransaccional.
        No reemplaza la validación atómica de `POST /v1/registro`.

        Pendiente (BITS-251, sin resolver): decisión de arquitectura sobre
        reconocimiento de cliente (App Check) para distinguir apps reales de
        tráfico de ataque en este endpoint público sin usuario autenticado.
      security: []
      parameters:
        - name: correo
          in: query
          required: false
          schema: { type: string, format: email, maxLength: 254 }
        - name: tipoDocumento
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TipoDocumento' }
        - name: numeroDocumento
          in: query
          required: false
          schema: { type: string, minLength: 4, maxLength: 20 }
      responses:
        '200':
          description: Disponibilidad de los campos consultados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disponibilidad' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }

  /v1/registro/reenvio-confirmacion:
    post:
      operationId: reenviarConfirmacion
      tags: [Registro]
      summary: Reenvía el correo de activación
      description: |
        Requiere el **ID token de Identity Platform** de la sesión recién creada
        y aún no confirmada (no la sesión propia del BFF) — así no hace falta un
        endpoint público indexado por correo. Identity Platform reenvía el
        enlace con su propio mecanismo (BITS-93 AC-4); esta operación no impone
        una ventana de vencimiento propia.
      security:
        - identityPlatformToken: []
      responses:
        '204':
          description: Correo de activación reenviado.
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/registro/confirmacion:
    post:
      operationId: confirmarCuenta
      tags: [Registro]
      summary: Confirma el correo con el código del enlace de verificación
      description: |
        **Público** (no requiere token ni sesión): el usuario puede abrir el enlace
        en otro dispositivo. El correo de verificación lleva un enlace a la web,
        `https://solventa4bits.com/verificar-correo?oobCode=XXXX`; la página lee el
        `oobCode` y lo envía aquí con un `POST` (nunca un `GET` directo, porque los
        escáneres de correo abren los enlaces y consumirían el código).

        El BFF canjea el código con Identity Platform (queda el correo verificado
        allí) y confirma la cuenta en CoreTransaccional con su fecha (BITS-93 AC-5).

        El código es **de un solo uso** y vence según Identity Platform: un código
        ya usado, vencido o inválido responde `422` con un mismo mensaje. El código
        no se registra en logs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmacionRequest' }
      responses:
        '200':
          description: Correo confirmado (`correoConfirmado` en `true`).
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuenta' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '422': { $ref: '#/components/responses/EntidadNoProcesable' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/sesiones:
    post:
      operationId: iniciarSesion
      tags: [Sesión]
      summary: Inicia sesión con correo y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredencialesRequest' }
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/sesiones/refresco:
    post:
      operationId: refrescarSesion
      tags: [Sesión]
      summary: Refresca el token de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Nuevo token de acceso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/cuenta:
    get:
      operationId: obtenerCuenta
      tags: [Cuenta]
      summary: Devuelve los datos del cliente autenticado
      responses:
        '200':
          description: Datos del cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuenta' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/cuenta/consentimientos:
    get:
      operationId: listarMisConsentimientos
      tags: [Consentimientos]
      summary: Estado de mis consentimientos
      responses:
        '200':
          description: Lista de consentimientos del cliente.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConsentimientoVista' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
    post:
      operationId: otorgarMiConsentimiento
      tags: [Consentimientos]
      summary: Otorga un consentimiento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtorgarConsentimientoRequest' }
      responses:
        '201':
          description: Consentimiento otorgado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentimientoVista' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/cuenta/consentimientos/{scope}:
    parameters:
      - name: scope
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConsentimientoScope' }
    delete:
      operationId: revocarMiConsentimiento
      tags: [Consentimientos]
      summary: Revoca un consentimiento
      responses:
        '204':
          description: Consentimiento revocado.
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/documentos-legales:
    get:
      operationId: listarDocumentosLegales
      tags: [Documentos legales]
      summary: Documentos legales vigentes, con su contenido
      description: |
        **Público** (no requiere token): el registro los muestra antes de que exista
        una sesión.

        Devuelve la versión vigente de cada documento (`terminos`, `open-data`,
        `open-finance`) ya con el contenido completo, en el orden en que el registro
        los presenta. Una sola llamada deja listos los tres modales sin más viajes a
        la red. Proxya a Productos y Configuración de Mercado sin transformar nada.

        **Aceptación.** El BFF no registra qué aceptó el cliente. La web devuelve la
        `version` de cada documento que mostró en los campos `politicaVersion*` de
        `POST /v1/registro`, y CoreTransaccional la guarda como evidencia.
      security: []
      parameters:
        - $ref: '#/components/parameters/Mercado'
        - $ref: '#/components/parameters/Idioma'
      responses:
        '200':
          description: Versión vigente de cada documento del mercado e idioma.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentoLegal' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/documentos-legales/{tipo}/versiones/{version}:
    get:
      operationId: obtenerVersionDocumentoLegal
      tags: [Documentos legales]
      summary: Una versión exacta de un documento (inmutable)
      description: |
        **Público** (no requiere token). Devuelve el texto exacto de una versión ya
        publicada: sirve para mostrar lo que el cliente aceptó aunque exista una
        versión posterior.

        Una versión publicada nunca cambia, por eso la respuesta se puede guardar
        indefinidamente (`Cache-Control: immutable`).
      security: []
      parameters:
        - name: tipo
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TipoDocumentoLegal' }
        - name: version
          in: path
          required: true
          schema: { type: string, pattern: '^V[1-9][0-9]*$', examples: [V1] }
        - $ref: '#/components/parameters/Mercado'
        - $ref: '#/components/parameters/Idioma'
      responses:
        '200':
          description: Versión solicitada.
          headers:
            Cache-Control:
              description: Una versión publicada nunca cambia.
              schema: { type: string, example: 'public, max-age=31536000, immutable' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoLegal' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/creditos-hipotecarios:
    get:
      operationId: obtenerCreditosHipotecarios
      tags: [Cotización]
      summary: Hipotecas del cliente y bancos del mercado, para empezar una cotización
      description: |
        Paso previo a cotizar. Devuelve las hipotecas abiertas del cliente que
        Perfilamiento ya trajo de Open Finance cuando el cliente dio su consentimiento
        (no se consulta a la fuente en esta llamada), junto con la lista de bancos del
        mercado. El cliente elige un banco y rellena el formulario con los datos de esa
        hipoteca sin volver a llamar al backend; si no hay datos, escribe los suyos.

        `estado` dice qué mostrar:
        - `DISPONIBLE`: hay hipotecas en `creditos`; el cliente elige una.
        - `SIN_HIPOTECAS`: la fuente respondió y no hay ninguna abierta; captura manual.
        - `SIN_CONSENTIMIENTO`: el cliente no autorizó Open Finance; captura manual.
        - `NO_DISPONIBLE`: no hay datos vigentes y la fuente no respondió; el cliente
          puede reintentar o escribir los datos.

        Siempre incluye `entidades` (los bancos del mercado) para la captura manual.
        Los datos son del cliente autenticado y la respuesta no se guarda en caché.
      parameters:
        - name: mercado
          in: query
          required: false
          schema: { type: string, enum: [CO], default: CO }
      responses:
        '200':
          description: Hipotecas del cliente y bancos del mercado.
          headers:
            Cache-Control:
              schema: { type: string, examples: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditosHipotecarios' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cuenta/evidencias-identidad:
    post:
      operationId: subirMiEvidenciaIdentidad
      tags: [Evidencias de identidad]
      summary: Sube una foto de mi cédula (o la selfie) y recibe el veredicto
      description: |
        Una imagen por request, ya comprimida por el cliente: `tipo` dice qué se sube y
        `imagen` es el archivo (JPEG o PNG, máximo 3 MB). El `clienteId` sale del token.

        El servidor decide si la foto sirve; el cliente solo muestra el resultado:

        - **`ACEPTADA`** (201): la foto queda como evidencia vigente del tipo.
        - **`REINTENTAR`** (200): no se guardó nada. `motivo` dice qué corregir y
          `intentosRestantes` cuántos rechazos quedan antes de pasar a revisión manual.
        - **`REVISION_MANUAL`** (201): se guardó y una persona la revisa; el flujo puede seguir.
          Ocurre si no se pudo leer el código del reverso o su número no coincide con el del
          registro, si el documento no es cédula de ciudadanía, si el análisis tardó demasiado,
          y al tercer rechazo de un mismo tipo.

        El resultado nunca incluye el número leído de la imagen.

        Cada envío cuenta como un intento: no se reintenta automáticamente ante un fallo de red.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SubirEvidenciaRequest' }
      responses:
        '200':
          description: La foto no sirve (`estado = REINTENTAR`). No se creó ninguna evidencia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaSubida' }
        '201':
          description: Evidencia guardada (`ACEPTADA` o `REVISION_MANUAL`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaSubida' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '413':
          description: La imagen supera el máximo permitido.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
    get:
      operationId: obtenerMiEstadoDeEvidenciasIdentidad
      tags: [Evidencias de identidad]
      summary: Estado de mis fotos de identidad
      description: |
        Siempre devuelve los tres tipos. `PENDIENTE` es que no hay evidencia vigente. Sirve para
        retomar el flujo donde quedó y para habilitar el paso a la firma: ambas caras de la
        cédula en `ACEPTADA` o `REVISION_MANUAL`.
      responses:
        '200':
          description: Estado por tipo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstadoEvidencia' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cotizaciones:
    post:
      operationId: crearCotizacion
      tags: [Cotización]
      summary: Cotiza un seguro de vida sobre crédito hipotecario
      description: |
        Calcula la cotización y la deja como **la activa** del cliente: una nueva reemplaza a
        la anterior (el cliente no acumula cotizaciones, compra pólizas). La cotización no
        tiene id propio.

        La identidad sale de la sesión: el cliente no puede cotizar en nombre de otro. La edad
        tampoco viaja en la solicitud: el BFF la calcula de la fecha de nacimiento de la sesión.
        Una sesión emitida antes de ese cambio responde `401`: hay que iniciar sesión de nuevo.

        Cotización y Rating intenta perfilar el riesgo; si esa dependencia no responde, cae a
        tarifa estándar (`personalizado: false`) en vez de fallar. Responde `400` con el campo
        y el rango cuando la edad no está entre 18 y 65 años, o cuando el crédito terminaría
        después de los 75 años.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CotizacionRequest' }
      responses:
        '201':
          description: Cotización creada. Es ahora la activa del cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '422': { $ref: '#/components/responses/EntidadNoProcesable' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cotizaciones/actual:
    get:
      operationId: obtenerCotizacionActiva
      tags: [Cotización]
      summary: Consulta la cotización activa del cliente
      description: |
        La cotización activa del cliente de la sesión, para mostrarla en el Home y retomarla.
        `estado` es `EXPIRADA` pasados 30 días de su creación.
      responses:
        '200':
          description: Cotización activa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      operationId: eliminarCotizacionActiva
      tags: [Cotización]
      summary: Elimina la cotización activa del cliente (declinar las condiciones)
      description: |
        El cliente declinó las condiciones: se borra su cotización activa y vuelve al estado
        de cero cotizaciones (`GET /v1/cotizaciones/actual` responde `404`). No se conserva
        historial. Si el cliente no tiene cotización activa responde `404`.

        La identidad sale de la sesión: el cliente solo puede eliminar su propia cotización.
      responses:
        '204':
          description: Cotización eliminada.
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

components:

  securitySchemes:
    clienteAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de Identity Platform obtenido en `/v1/registro` o `/v1/sesiones`.
    identityPlatformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ID token de Identity Platform tal cual lo emite (no la sesión propia del
        BFF). El BFF lo valida contra Identity Platform, no localmente — se usa
        solo en el reenvío del correo de activación
        (`/v1/registro/reenvio-confirmacion`), donde el cliente puede no tener aún
        una sesión del BFF completamente confirmada.

  parameters:
    Mercado:
      name: mercado
      in: query
      required: true
      schema: { type: string, enum: [CO] }
    Idioma:
      name: idioma
      in: query
      required: false
      schema: { type: string, pattern: '^[a-z]{2}-[A-Z]{2}$', default: es-CO, examples: [es-CO] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Clave de idempotencia para reintentar el registro sin duplicar. Genere una
        clave por intento de registro y reutilícela solo al reintentar ese mismo intento.
      schema: { type: string, maxLength: 64 }

  responses:
    SolicitudInvalida:
      description: Solicitud mal formada o con validación de esquema fallida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }
          examples:
            camposInvalidos:
              summary: Campos que no cumplen el esquema
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: La solicitud no cumple el esquema
                instance: https://dev.solventa4bits.com/web/v1/registro
                errores:
                  - campo: body.email
                    mensaje: String should match pattern '^[^@\s]+@[^@\s]+\.[^@\s]+$'
                  - campo: body.password
                    mensaje: String should have at least 10 characters
            campoFaltante:
              summary: Falta un campo obligatorio
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: La solicitud no cumple el esquema
                instance: https://dev.solventa4bits.com/web/v1/registro
                errores:
                  - campo: body.primerApellido
                    mensaje: Field required
    NoAutorizado:
      description: Falta el token, está expirado o es inválido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            sinToken:
              summary: No se envió el encabezado Authorization
              value:
                type: about:blank
                title: No autorizado
                status: 401
                detail: falta el encabezado Authorization
                instance: https://dev.solventa4bits.com/web/v1/cuenta
            tokenExpirado:
              summary: El token ya venció
              value:
                type: about:blank
                title: No autorizado
                status: 401
                detail: token expirado
                instance: https://dev.solventa4bits.com/web/v1/cuenta
            credencialesInvalidas:
              summary: Correo o contraseña incorrectos (inicio de sesión)
              value:
                type: about:blank
                title: No autorizado
                status: 401
                detail: credenciales inválidas
                instance: https://dev.solventa4bits.com/web/v1/sesiones
    Conflicto:
      description: El correo o el documento ya están registrados. `errores[0].campo` dice cuál.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaConflicto' }
          examples:
            correoRegistrado:
              summary: El correo ya tiene una cuenta
              value:
                type: about:blank
                title: Conflicto
                status: 409
                detail: El correo ya está registrado
                instance: https://dev.solventa4bits.com/web/v1/registro
                errores:
                  - campo: correo
                    mensaje: El correo ya está registrado
            documentoRegistrado:
              summary: El documento ya pertenece a un cliente
              value:
                type: about:blank
                title: Conflicto
                status: 409
                detail: El documento ya está registrado
                instance: https://dev.solventa4bits.com/web/v1/registro
                errores:
                  - campo: documento
                    mensaje: El documento ya está registrado
    EntidadNoProcesable:
      description: La solicitud es válida pero incumple una regla de negocio.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            enlaceInvalido:
              summary: El código del enlace de verificación ya se usó, venció o no es válido
              value:
                type: about:blank
                title: Regla de negocio no satisfecha
                status: 422
                detail: El enlace de confirmación no es válido, ya se usó o venció
                instance: https://dev.solventa4bits.com/web/v1/registro/confirmacion
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            cotizacionNoExiste:
              summary: La cotización no existe o no es del cliente
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: Cotización no encontrada
                instance: https://dev.solventa4bits.com/web/v1/cotizaciones/7c9e6679-7425-40de-944b-e07fc1f90ae7
            consentimientoNoExiste:
              summary: El consentimiento no existe
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: Consentimiento no encontrado
                instance: https://dev.solventa4bits.com/web/v1/cuenta/consentimientos/OPEN_FINANCE
    DependenciaNoDisponible:
      description: Una dependencia aguas abajo (Identity Platform / CoreTransaccional / Cotización y Rating / Productos y Configuración de Mercado) no respondió a tiempo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            dependenciaLenta:
              summary: CoreTransaccional no respondió a tiempo
              value:
                type: about:blank
                title: Dependencia no disponible
                status: 503
                detail: timeout esperando respuesta de svc-core
                instance: https://dev.solventa4bits.com/web/v1/registro

  schemas:

    RegistroRequest:
      type: object
      additionalProperties: false
      required: [email, password, tipoDocumento, numeroDocumento, primerNombre, primerApellido, fechaNacimiento, telefono, politicaVersion, aceptaTerminos, autorizaTratamientoDatos, autorizaDatosFinancieros]
      examples:
        - email: ana.rios@example.com
          password: Clave-Segura-2026
          tipoDocumento: CC
          numeroDocumento: '1032456789'
          primerNombre: Ana
          segundoNombre: María
          primerApellido: Ríos
          segundoApellido: Gómez
          fechaNacimiento: '1990-03-15'
          telefono: '+573001234567'
          politicaVersion: v1
          aceptaTerminos: true
          autorizaTratamientoDatos: true
          politicaVersionTratamientoDatos: v1
          autorizaDatosFinancieros: true
          politicaVersionDatosFinancieros: v1
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumento' }
        numeroDocumento: { type: string, minLength: 4, maxLength: 20, pattern: '^[0-9A-Za-z-]+$' }
        primerNombre: { type: string, minLength: 1, maxLength: 60 }
        segundoNombre: { type: [string, 'null'], maxLength: 60 }
        primerApellido: { type: string, minLength: 1, maxLength: 60 }
        segundoApellido: { type: [string, 'null'], maxLength: 60 }
        fechaNacimiento: { type: string, format: date }
        telefono: { type: string, pattern: '^\+?[0-9]{7,15}$', description: Celular de contacto (obligatorio). }
        politicaVersion: { type: string, maxLength: 20, description: Versión de términos y política de datos aceptada. }
        aceptaTerminos:
          type: boolean
          const: true
          description: Debe ser true; el cliente aceptó términos y política de tratamiento de datos.
        autorizaTratamientoDatos:
          type: boolean
          description: |
            Consentimiento OPEN_DATA / tratamiento de datos personales. `false`
            no bloquea el registro; solo deja el consentimiento en `NO_OTORGADO`.
        politicaVersionTratamientoDatos:
          type: [string, 'null']
          maxLength: 20
          description: Versión del aviso de tratamiento de datos aceptado. Solo aplica si se autoriza.
        autorizaDatosFinancieros:
          type: boolean
          description: |
            Consentimiento OPEN_FINANCE (BITS-93 AC-9). `false` no bloquea el
            registro — al cotizar, el precio se calcula solo con los datos que
            el cliente aporte.
        politicaVersionDatosFinancieros:
          type: [string, 'null']
          maxLength: 20
          description: Versión de la autorización de datos financieros aceptada. Solo aplica si se autoriza.

    ConfirmacionRequest:
      type: object
      additionalProperties: false
      required: [oobCode]
      properties:
        oobCode:
          type: string
          minLength: 10
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
          description: Código de un solo uso del enlace de verificación (parámetro `oobCode` de la URL).
          examples: [AbCdEf0123456789_-xYz]

    RegistroResponse:
      type: object
      additionalProperties: false
      required: [cuenta, sesion]
      examples:
        - cuenta:
            clienteId: 3f2b8c1e-7d4a-4e5b-9a61-2c8d5f0b7e14
            primerNombre: Ana
            segundoNombre: María
            primerApellido: Ríos
            segundoApellido: Gómez
            email: ana.rios@example.com
            telefono: '+573001234567'
            estado: ACTIVO
            correoConfirmado: false
          sesion:
            accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6IjEifQ.eyJzdWIiOiJhbmEifQ.c2lnbmF0dXJh
            tokenType: Bearer
            expiresIn: 3600
            refreshToken: AMf-vBzQ7Xk2nH4wT9pLr0eYd
      properties:
        cuenta: { $ref: '#/components/schemas/Cuenta' }
        sesion: { $ref: '#/components/schemas/Sesion' }

    CredencialesRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      examples:
        - email: ana.rios@example.com
          password: Clave-Segura-2026
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    Sesion:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, refreshToken]
      examples:
        - accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6IjEifQ.eyJzdWIiOiJhbmEifQ.c2lnbmF0dXJh
          tokenType: Bearer
          expiresIn: 3600
          refreshToken: AMf-vBzQ7Xk2nH4wT9pLr0eYd
      properties:
        accessToken: { type: string, description: JWT de Identity Platform. }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Segundos de vigencia del accessToken. }
        refreshToken: { type: string }

    Cuenta:
      type: object
      additionalProperties: false
      required: [clienteId, primerNombre, primerApellido, email, telefono, estado, correoConfirmado]
      examples:
        - clienteId: 3f2b8c1e-7d4a-4e5b-9a61-2c8d5f0b7e14
          primerNombre: Ana
          segundoNombre: María
          primerApellido: Ríos
          segundoApellido: Gómez
          email: ana.rios@example.com
          telefono: '+573001234567'
          estado: ACTIVO
          correoConfirmado: true
      properties:
        clienteId: { type: string, format: uuid }
        primerNombre: { type: string }
        segundoNombre: { type: [string, 'null'] }
        primerApellido: { type: string }
        segundoApellido: { type: [string, 'null'] }
        email: { type: string, format: email }
        telefono: { type: string }
        estado: { $ref: '#/components/schemas/EstadoCliente' }
        correoConfirmado:
          type: boolean
          description: BITS-93 AC-3 — no condiciona cotización ni coberturas, solo la formalización del contrato.

    TipoDocumentoLegal:
      type: string
      enum: [terminos, open-data, open-finance]
      description: |
        - `terminos` — términos y condiciones y aviso de privacidad.
        - `open-data` — tratamiento de datos personales.
        - `open-finance` — consulta en centrales de riesgo (datos financieros).

    DocumentoLegal:
      type: object
      additionalProperties: false
      required: [tipo, version, titulo, baseLegal, contenido]
      examples:
        - tipo: open-finance
          version: V1
          titulo: Consulta en centrales de riesgo
          subtitulo: Es opcional. Si la das, tu precio puede bajar.
          baseLegal: Ley 1266 de 2008
          contenido: '<h3>1 · Qué autorizas</h3><p>Consultar y reportar tu comportamiento crediticio ante los operadores de información.</p><h3>2 · Puedes retirarla</h3><p>Quitas esta autorización cuando quieras desde tu perfil.</p>'
          notaPie: Es opcional. Si no la autorizas puedes seguir igual.
      properties:
        tipo: { $ref: '#/components/schemas/TipoDocumentoLegal' }
        version:
          type: string
          pattern: '^V[1-9][0-9]*$'
          description: Versión publicada (`V1`, `V2`, …). La web la envía de vuelta al registrar la aceptación.
        titulo: { type: string }
        subtitulo: { type: string, description: Se omite cuando no tiene. }
        baseLegal: { type: string, description: 'Ley que respalda el documento, por ejemplo `Ley 1581 de 2012`.' }
        contenido:
          type: string
          description: |
            Cuerpo del documento con formato (HTML).
            Etiquetas permitidas: `h3`, `p`, `ul`, `ol`, `li`, `strong`, `em`, `a`, `span`.
            Atributos permitidos: `href` en `a` (solo esquemas `https` y `mailto`) y
            `class` (solo valores con prefijo `legal-`, por ejemplo `legal-highlight`).
            No se permiten `style`, `script`, etiquetas de estilo, imágenes ni
            manejadores de eventos. La web define el significado visual de cada clase
            `legal-*` y debe sanear el HTML con esta misma lista antes de pintarlo.
        notaPie: { type: string, description: Texto de pie del documento. Se omite cuando no tiene. }

    Disponibilidad:
      type: object
      additionalProperties: false
      examples:
        - correoDisponible: false
          documentoDisponible: true
      properties:
        correoDisponible: { type: [boolean, 'null'], description: 'null si no se consultó correo.' }
        documentoDisponible: { type: [boolean, 'null'], description: 'null si no se consultó documento.' }

    OtorgarConsentimientoRequest:
      type: object
      additionalProperties: false
      required: [scope, politicaVersion]
      examples:
        - scope: OPEN_FINANCE
          politicaVersion: v1
      properties:
        scope: { $ref: '#/components/schemas/ConsentimientoScope' }
        politicaVersion: { type: string, maxLength: 20 }

    ConsentimientoVista:
      type: object
      additionalProperties: false
      required: [scope, estado, vigente]
      examples:
        - scope: OPEN_FINANCE
          estado: OTORGADO
          vigente: true
          actualizadoEn: '2026-10-06T14:32:10Z'
      properties:
        scope: { $ref: '#/components/schemas/ConsentimientoScope' }
        estado: { $ref: '#/components/schemas/EstadoConsentimientoEnum' }
        vigente: { type: boolean }
        actualizadoEn: { type: [string, 'null'], format: date-time }

    DatosCredito:
      type: object
      additionalProperties: false
      required: [valorCredito, plazoRestanteMeses, entidadAcreedora, saldoInsoluto]
      properties:
        valorCredito: { type: number, minimum: 10000000 }
        plazoRestanteMeses:
          type: integer
          minimum: 1
          maximum: 480
          description: Meses que le faltan al crédito. Con la edad, no puede pasar de los 75 años.
        entidadAcreedora: { type: string, minLength: 2, maxLength: 80 }
        saldoInsoluto: { type: number, exclusiveMinimum: 0 }

    CotizacionRequest:
      type: object
      additionalProperties: false
      required: [datosCredito]
      examples:
        - datosCredito:
            valorCredito: 250000000
            plazoRestanteMeses: 180
            entidadAcreedora: Bancolombia
            saldoInsoluto: 238500000
      properties:
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }

    FactorRiesgo:
      type: object
      additionalProperties: false
      required: [descripcion, efecto]
      properties:
        descripcion: { type: string }
        efecto: { type: string, enum: [POSITIVO, NEGATIVO] }
        pesoRelativo: { type: [number, 'null'] }

    PerfilRiesgo:
      type: object
      additionalProperties: false
      required: [nivelRiesgo, factores]
      properties:
        nivelRiesgo: { type: string, enum: [BAJO, MEDIO, ALTO] }
        factores:
          type: array
          items: { $ref: '#/components/schemas/FactorRiesgo' }

    Oferta:
      type: object
      additionalProperties: false
      required: [primaMensual, primaBaseMensual, sumaAsegurada, coberturaMeses, moneda, personalizado, desglose]
      properties:
        primaMensual: { type: number }
        primaBaseMensual: { type: number }
        sumaAsegurada: { type: number }
        coberturaMeses: { type: integer }
        moneda: { type: string, const: COP }
        personalizado: { type: boolean }
        fuentesNoDisponibles:
          type: array
          items: { type: string }
        desglose: { $ref: '#/components/schemas/Desglose' }

    CoberturaPrecio:
      type: object
      additionalProperties: false
      required: [codigo, obligatoria, sumaAsegurada, primaNeta, iva, primaTotal]
      properties:
        codigo: { type: string, enum: [VIDA, HOGAR] }
        obligatoria: { type: boolean, description: true para VIDA, false para HOGAR. }
        sumaAsegurada:
          type: number
          description: "VIDA: saldo insoluto. HOGAR: min(240.000.000, valorCredito)."
        primaNeta: { type: number, description: Prima mensual sin IVA. }
        iva: { type: number, description: IVA mensual. 0 en VIDA; 19 % de primaNeta en HOGAR. }
        primaTotal: { type: number, description: Prima mensual con IVA (primaNeta + iva). }

    Desglose:
      type: object
      additionalProperties: false
      required: [coberturas]
      description: |
        Precio de cada cobertura. No trae totales: el servicio no guarda la selección del
        cliente, así que el front suma los `primaNeta`, `iva` y `primaTotal` de las coberturas
        que el cliente elija. HOGAR es opcional y no viene marcada por defecto.
      properties:
        coberturas:
          type: array
          items: { $ref: '#/components/schemas/CoberturaPrecio' }

    Vigencia:
      type: object
      additionalProperties: false
      required: [desde, hasta]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }

    EntidadFinanciera:
      type: object
      additionalProperties: false
      required: [id, nombre]
      properties:
        id: { type: string, examples: [bancolombia] }
        nombre: { type: string, examples: [Bancolombia] }

    CreditoHipotecario:
      type: object
      additionalProperties: false
      required: [entidadNombre, valorCredito, saldoInsoluto, plazoRestanteMeses, cuotaMensual]
      properties:
        entidadId:
          type: string
          description: Entidad del mercado a la que corresponde. Ausente si el banco no está en la lista.
        entidadNombre:
          type: string
          description: Nombre de la entidad para mostrar.
        valorCredito: { type: number, description: Monto total del crédito, en COP. }
        saldoInsoluto: { type: number, description: Saldo a hoy, en COP. }
        plazoRestanteMeses: { type: integer, minimum: 1, description: Meses que faltan. }
        cuotaMensual: { type: number, description: Cuota mensual, en COP. }

    CreditosHipotecarios:
      type: object
      additionalProperties: false
      required: [estado, creditos, entidades, origen]
      examples:
        - estado: DISPONIBLE
          origen: OPEN_FINANCE
          fechaConsulta: '2026-10-09T12:00:00Z'
          creditos:
            - entidadId: bancolombia
              entidadNombre: Bancolombia
              valorCredito: 380000000
              saldoInsoluto: 320000000
              plazoRestanteMeses: 180
              cuotaMensual: 3100000
          entidades:
            - { id: bancolombia, nombre: Bancolombia }
            - { id: davivienda, nombre: Davivienda }
      properties:
        estado:
          type: string
          enum: [DISPONIBLE, SIN_HIPOTECAS, SIN_CONSENTIMIENTO, NO_DISPONIBLE]
        creditos:
          type: array
          items: { $ref: '#/components/schemas/CreditoHipotecario' }
        entidades:
          type: array
          items: { $ref: '#/components/schemas/EntidadFinanciera' }
          description: Bancos del mercado, en el orden en que se presentan.
        origen:
          type: string
          enum: [OPEN_FINANCE]
        fechaConsulta:
          type: string
          format: date-time
          description: Cuándo se trajeron los datos de la fuente. Ausente si no hay datos.

    Cotizacion:
      type: object
      additionalProperties: false
      required: [estado, producto, datosCredito, origenDatos, oferta, vigenciaCotizacion, creadaEn]
      examples:
        - estado: VIGENTE
          producto: VIDA_HIPOTECARIO
          datosCredito:
            valorCredito: 250000000
            plazoRestanteMeses: 180
            entidadAcreedora: Bancolombia
            saldoInsoluto: 238500000
          origenDatos: DECLARADO
          oferta:
            primaMensual: 39734
            primaBaseMensual: 46746
            sumaAsegurada: 238500000
            coberturaMeses: 180
            moneda: COP
            personalizado: true
            desglose:
              coberturas:
                - codigo: VIDA
                  obligatoria: true
                  sumaAsegurada: 238500000
                  primaNeta: 39734
                  iva: 0
                  primaTotal: 39734
                - codigo: HOGAR
                  obligatoria: false
                  sumaAsegurada: 240000000
                  primaNeta: 23760
                  iva: 4514
                  primaTotal: 28274
          perfilRiesgo:
            nivelRiesgo: BAJO
            factores:
              - descripcion: Historial de pagos excelente
                efecto: POSITIVO
                pesoRelativo: 0.1
              - descripcion: Endeudamiento bajo
                efecto: POSITIVO
                pesoRelativo: 0.2
          vigenciaCotizacion:
            desde: '2026-10-06T14:35:00Z'
            hasta: '2026-11-05T14:35:00Z'
          creadaEn: '2026-10-06T14:35:00Z'
      properties:
        estado: { type: string, enum: [VIGENTE, EXPIRADA] }
        producto: { type: string, const: VIDA_HIPOTECARIO }
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }
        origenDatos:
          type: string
          enum: [DECLARADO]
          description: De dónde salen los datos del crédito. Hoy los escribe el cliente.
        oferta: { $ref: '#/components/schemas/Oferta' }
        perfilRiesgo:
          oneOf:
            - { $ref: '#/components/schemas/PerfilRiesgo' }
            - type: 'null'
        vigenciaCotizacion: { $ref: '#/components/schemas/Vigencia' }
        creadaEn: { type: string, format: date-time }

    TipoDocumento:
      type: string
      enum: [CC, CE, PA]
    EstadoCliente:
      type: string
      enum: [ACTIVO, BLOQUEADO, INACTIVO]
    ConsentimientoScope:
      type: string
      enum: [OPEN_FINANCE, OPEN_DATA]
    EstadoConsentimientoEnum:
      type: string
      enum: [OTORGADO, REVOCADO, NO_OTORGADO]

    TipoEvidencia:
      type: string
      enum: [cedula_frente, cedula_reverso, selfie]
    EstadoVeredicto:
      type: string
      enum: [ACEPTADA, REINTENTAR, REVISION_MANUAL]
    MotivoRechazo:
      type: string
      enum: [BORROSA, OSCURA, REFLEJO, RECORTADA, NO_ES_CEDULA]
      description: |
        Qué corregir al repetir la foto. `REFLEJO` incluye demasiada luz en toda la foto,
        `BORROSA` incluye una foto con muy pocos píxeles, y `NO_ES_CEDULA` es que no se
        reconoció una tarjeta con la proporción de una cédula.

    SubirEvidenciaRequest:
      type: object
      required: [tipo, imagen]
      properties:
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        imagen: { type: string, format: binary, description: Foto en JPEG o PNG, máximo 3 MB. }

    EvidenciaSubida:
      type: object
      additionalProperties: false
      required: [tipo, estado, intentosRestantes]
      examples:
        - { evidenciaId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, tipo: cedula_frente, estado: ACEPTADA, motivo: null, intentosRestantes: 3 }
        - { evidenciaId: null, tipo: cedula_reverso, estado: REINTENTAR, motivo: REFLEJO, intentosRestantes: 2 }
      properties:
        evidenciaId:
          type: [string, 'null']
          format: uuid
          description: "`null` con `REINTENTAR`: no se guardó nada."
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        estado: { $ref: '#/components/schemas/EstadoVeredicto' }
        motivo:
          oneOf:
            - { $ref: '#/components/schemas/MotivoRechazo' }
            - { type: 'null' }
          description: Solo con `REINTENTAR`.
        intentosRestantes:
          type: integer
          minimum: 0
          description: Rechazos que quedan antes de pasar a revisión manual. Se reinicia al guardar una evidencia.

    EstadoEvidencia:
      type: object
      additionalProperties: false
      required: [tipo, estado, intentosRestantes]
      properties:
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        estado: { type: string, enum: [ACEPTADA, REVISION_MANUAL, PENDIENTE] }
        evidenciaId: { type: [string, 'null'], format: uuid }
        creadaEn: { type: [string, 'null'], format: date-time }
        intentosRestantes: { type: integer, minimum: 0 }

    Problema:
      description: Error en formato RFC 9457 (Problem Details for HTTP APIs).
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
      examples:
        - type: about:blank
          title: Conflicto
          status: 409
          detail: El correo ya está registrado
          instance: https://dev.solventa4bits.com/web/v1/registro

    ProblemaConflicto:
      description: |
        `Problema` de un conflicto de registro (`409`). `errores` trae un único elemento
        con el campo repetido.
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          required: [errores]
          properties:
            errores:
              type: array
              minItems: 1
              items:
                type: object
                required: [campo, mensaje]
                properties:
                  campo: { type: string, enum: [correo, documento] }
                  mensaje: { type: string }
      examples:
        - type: about:blank
          title: Conflicto
          status: 409
          detail: El correo ya está registrado
          instance: https://dev.solventa4bits.com/web/v1/registro
          errores:
            - campo: correo
              mensaje: El correo ya está registrado

    ProblemaValidacion:
      description: |
        `Problema` con el detalle campo por campo. Solo lo devuelve la validación
        del esquema de la solicitud (`400`); el resto de errores no lleva `errores`.
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            errores:
              type: array
              items:
                type: object
                properties:
                  campo: { type: string, description: Ruta del campo con error, por ejemplo `body.email`. }
                  mensaje: { type: string }
      examples:
        - type: about:blank
          title: Solicitud inválida
          status: 400
          detail: La solicitud no cumple el esquema
          instance: https://dev.solventa4bits.com/web/v1/registro
          errores:
            - campo: body.email
              mensaje: String should match pattern '^[^@\s]+@[^@\s]+\.[^@\s]+$'
            - campo: body.password
              mensaje: String should have at least 10 characters
